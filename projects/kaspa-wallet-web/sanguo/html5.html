<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KAS 三國志 - 策略Web遊戲</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Arial', sans-serif; background: #0a0a1a; color: #ffd700; overflow: hidden; user-select: none; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%); }
        #gameCanvas { position: absolute; top: 0; left: 0; cursor: pointer; background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a1a 100%); }
        canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* 登入 Modal */
        #loginModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 500;
        }
        #loginModal .login-box {
            background: rgba(10,10,26,0.95); border: 2px solid rgba(255,215,0,0.5);
            border-radius: 15px; padding: 30px; min-width: 300px; text-align: center;
        }
        #loginModal h1 { color: #ffd700; margin-bottom: 10px; font-size: 24px; }
        #loginModal p { color: #999; margin-bottom: 20px; font-size: 14px; }
        #loginModal input {
            width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px; background: rgba(10,10,26,0.8); color: #ffd700; font-size: 16px; text-align: center;
        }
        #loginModal input::placeholder { color: #666; }
        .btn-login {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #4a90d9, #357abd);
            color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .btn-login:hover { box-shadow: 0 5px 15px rgba(74,144,217,0.4); }
        .login-error { color: #d94a4a; font-size: 13px; margin-top: 8px; display: none; }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(10,10,26,0.85); backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255,215,0,0.3);
            display: none; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 100;
        }
        .hud-section { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: bold; }
        .hud-item { display: flex; align-items: center; gap: 4px; }
        .hud-value { color: #4a90d9; }
        .player-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .btn-logout { background: none; border: 1px solid #666; color: #999; padding: 4px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }

        /* 面板共用 */
        .panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10,10,26,0.95); backdrop-filter: blur(15px);
            border: 2px solid rgba(255,215,0,0.5); border-radius: 15px; padding: 20px;
            min-width: 300px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 200;
        }
        .panel h2 { color: #ffd700; margin-bottom: 15px; text-align: center; font-size: 18px; }
        .city-info { margin-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
        .info-item { display: flex; justify-content: space-between; padding: 5px; background: rgba(74,144,217,0.1); border-radius: 5px; }
        .panel-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .btn { background: linear-gradient(135deg, #4a90d9, #357abd); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; min-width: 100px; }
        .btn-close { background: linear-gradient(135deg, #666, #444); width: 100%; margin-top: 10px; }
        .btn-attack { background: linear-gradient(135deg, #d94a4a, #bd3535); }
        .troop-type { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; padding: 8px; background: rgba(74,144,217,0.1); border-radius: 8px; }
        .troop-input { width: 80px; padding: 5px; border: 1px solid rgba(255,215,0,0.3); border-radius: 5px; background: rgba(10,10,26,0.8); color: #ffd700; text-align: center; }
        .battle-result { text-align: center; margin: 15px 0; font-size: 16px; font-weight: bold; }
        .victory { color: #4a90d9; }
        .defeat { color: #d94a4a; }
        .fog-warning { color: #ff9800; font-size: 12px; text-align: center; margin: 10px 0; }

        /* 勝利 Modal */
        #victoryModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 400;
        }
        #victoryModal .victory-box {
            background: rgba(10,10,26,0.95); border: 3px solid #ffd700; border-radius: 15px; padding: 40px; text-align: center;
        }
        #victoryModal h1 { color: #ffd700; font-size: 28px; margin-bottom: 15px; }
        #victoryModal p { color: #87ceeb; font-size: 16px; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            .panel { min-width: 280px; padding: 15px; }
            .btn { padding: 8px 12px; font-size: 12px; min-width: 90px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="loading" id="loadingScreen" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffd700;font-size:18px;z-index:1000;">載入中...</div>

        <!-- 登入 -->
        <div id="loginModal">
            <div class="login-box">
                <h1>🏯 KAS 三國志</h1>
                <p>輸入 ID 和密碼開始遊戲</p>
                <input type="text" id="loginInput" placeholder="玩家 ID" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="數字密碼（4-8位）" autocomplete="off">
                <button class="btn-login" id="loginBtn">進入亂世</button>
                <div class="login-error" id="loginError"></div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-section">
                <span class="player-dot" id="playerDot"></span>
                <span id="playerName">玩家</span>
                <button class="btn-logout" onclick="logout()">🚪</button>
            </div>
            <div class="hud-section">
                <div class="hud-item"><span>💰</span><span class="hud-value" id="kasBalance">0</span></div>
                <div class="hud-item"><span>🏰</span><span class="hud-value" id="cityCount">0</span></div>
                <div class="hud-item"><span>⚔️</span><span class="hud-value" id="totalTroops">0</span></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- 城池面板 -->
        <div class="panel" id="cityPanel">
            <h2 id="cityName">城池</h2>
            <div class="city-info">
                <div class="info-item"><span>等級</span><span id="cityLevel">C</span></div>
                <div class="info-item"><span>產出</span><span id="cityProduction">15/時</span></div>
                <div class="info-item"><span>步兵</span><span id="cityInfantry">0</span></div>
                <div class="info-item"><span>騎兵</span><span id="cityCavalry">0</span></div>
            </div>
            <div class="fog-warning" id="fogWarning" style="display:none">🌫️ 情報有限 — 需要偵查</div>
            <div class="panel-buttons" id="cityActions"></div>
            <button class="btn btn-close" onclick="closeCityPanel()">關閉</button>
        </div>

        <!-- 行軍面板 -->
        <div class="panel" id="marchPanel">
            <h2>出兵 — <span id="marchTarget"></span></h2>
            <div>
                <div class="troop-type"><span>步兵 (可用: <span id="availInf">0</span>)</span><input type="number" class="troop-input" id="marchInf" min="0" value="0"></div>
                <div class="troop-type"><span>騎兵 (可用: <span id="availCav">0</span>)</span><input type="number" class="troop-input" id="marchCav" min="0" value="0"></div>
            </div>
            <div class="city-info">
                <div class="info-item"><span>行軍時間</span><span id="marchTime">1分鐘</span></div>
                <div class="info-item"><span>糧草消耗</span><span id="marchCost">0 tKAS</span></div>
            </div>
            <div class="panel-buttons">
                <button class="btn btn-attack" onclick="confirmMarch()">確認出兵</button>
                <button class="btn btn-close" onclick="closeMarchPanel()">取消</button>
            </div>
        </div>

        <!-- 戰報 -->
        <div class="panel" id="battleReportModal" style="z-index:300">
            <h2>戰報</h2>
            <div id="battleReportContent"></div>
            <button class="btn btn-close" onclick="closeBattleReport()">確定</button>
        </div>

        <!-- 勝利 -->
        <div id="victoryModal">
            <div class="victory-box">
                <h1>🏆 統一天下！</h1>
                <p id="victoryText"></p>
                <button class="btn-login" style="margin-top:20px" onclick="location.reload()">再來一局</button>
            </div>
        </div>
    </div>

    <script>
    // ============ 色盤 ============
    const PLAYER_COLORS = [
        '#4a90d9','#d94a4a','#4ad94a','#d9d94a','#d94ad9','#4ad9d9',
        '#d9904a','#904ad9','#d9704a','#4a7fd9','#7fd94a','#d94a7f'
    ];

    // ============ 遊戲常數 ============
    const CONFIG = {
        PRODUCTION_INTERVAL: 30000, // 30s (MVP 加速)
        TROOP_COST: { infantry: 1.5, cavalry: 3 },
        TROOP_STATS: { infantry: { atk: 5, def: 6 }, cavalry: { atk: 8, def: 3 } },
        FOG_RANGE: 2 // BFS 步數
    };

    // ============ 城池模板（~25 座，比照光榮三國志） ============
    const CITIES_TEMPLATE = {
        // === S 帝都 ===
        luoyang:    { name:'洛陽', tier:'S', production:100, pos:{x:380,y:220}, garrison:{infantry:500,cavalry:300} },
        changan:    { name:'長安', tier:'S', production:100, pos:{x:220,y:230}, garrison:{infantry:500,cavalry:200} },
        // === A 州府 ===
        xuchang:    { name:'許昌', tier:'A', production:60, pos:{x:420,y:290}, garrison:{infantry:300,cavalry:100} },
        yecheng:    { name:'鄴城', tier:'A', production:60, pos:{x:420,y:140}, garrison:{infantry:300,cavalry:80} },
        chengdu:    { name:'成都', tier:'A', production:60, pos:{x:120,y:400}, garrison:{infantry:250,cavalry:50} },
        // === B 大城 ===
        xiangyang:  { name:'襄陽', tier:'B', production:30, pos:{x:350,y:370}, garrison:{infantry:200,cavalry:0} },
        hanzhong:   { name:'漢中', tier:'B', production:30, pos:{x:180,y:340}, garrison:{infantry:200,cavalry:0} },
        xiapi:      { name:'下邳', tier:'B', production:30, pos:{x:530,y:250}, garrison:{infantry:180,cavalry:20} },
        shouchun:   { name:'壽春', tier:'B', production:30, pos:{x:510,y:330}, garrison:{infantry:180,cavalry:0} },
        jiangling:  { name:'江陵', tier:'B', production:30, pos:{x:300,y:420}, garrison:{infantry:170,cavalry:0} },
        jianye:     { name:'建業', tier:'B', production:30, pos:{x:560,y:380}, garrison:{infantry:200,cavalry:0} },
        // === C 中城 ===
        wancheng:   { name:'宛城', tier:'C', production:15, pos:{x:350,y:310}, garrison:{infantry:80,cavalry:0} },
        runnan:     { name:'汝南', tier:'C', production:15, pos:{x:450,y:340}, garrison:{infantry:60,cavalry:0} },
        chenliu:    { name:'陳留', tier:'C', production:15, pos:{x:420,y:220}, garrison:{infantry:50,cavalry:0} },
        pingyuan:   { name:'平原', tier:'C', production:15, pos:{x:490,y:130}, garrison:{infantry:50,cavalry:0} },
        tianshui:   { name:'天水', tier:'C', production:15, pos:{x:150,y:260}, garrison:{infantry:70,cavalry:0} },
        lujiang:    { name:'廬江', tier:'C', production:15, pos:{x:510,y:370}, garrison:{infantry:60,cavalry:0} },
        // === D 小城 ===
        xiaopei:    { name:'小沛', tier:'D', production:5, pos:{x:490,y:220}, garrison:{infantry:30,cavalry:0} },
        xinye:      { name:'新野', tier:'D', production:5, pos:{x:370,y:380}, garrison:{infantry:20,cavalry:0} },
        shangyong:  { name:'上庸', tier:'D', production:5, pos:{x:250,y:370}, garrison:{infantry:20,cavalry:0} },
        langya:     { name:'琅琊', tier:'D', production:5, pos:{x:540,y:190}, garrison:{infantry:25,cavalry:0} },
        beihai:     { name:'北海', tier:'D', production:5, pos:{x:530,y:150}, garrison:{infantry:25,cavalry:0} },
        wuling:     { name:'武陵', tier:'D', production:5, pos:{x:250,y:450}, garrison:{infantry:20,cavalry:0} },
        jiameng:    { name:'葭萌', tier:'D', production:5, pos:{x:150,y:350}, garrison:{infantry:20,cavalry:0} },
        puyang:     { name:'濮陽', tier:'D', production:5, pos:{x:430,y:170}, garrison:{infantry:30,cavalry:0} },
    };

    // ============ 道路（史實路線） ============
    const CONNECTIONS = {
        luoyang:   ['changan','xuchang','chenliu','puyang'],
        changan:   ['luoyang','tianshui','wancheng','hanzhong'],
        xuchang:   ['luoyang','chenliu','runnan','wancheng'],
        yecheng:   ['puyang','pingyuan'],
        chengdu:   ['jiameng','wuling'],
        xiangyang: ['wancheng','xinye','jiangling','shangyong'],
        hanzhong:  ['changan','shangyong','jiameng','tianshui'],
        xiapi:     ['xiaopei','shouchun','langya'],
        shouchun:  ['xiapi','runnan','lujiang'],
        jiangling: ['xiangyang','wuling'],
        jianye:    ['lujiang','shouchun'],
        wancheng:  ['changan','xuchang','xiangyang','runnan','xinye'],
        runnan:    ['xuchang','wancheng','shouchun','xinye'],
        chenliu:   ['luoyang','xuchang','puyang','xiaopei'],
        pingyuan:  ['yecheng','beihai'],
        tianshui:  ['changan','hanzhong'],
        lujiang:   ['shouchun','jianye'],
        xiaopei:   ['chenliu','xiapi','langya'],
        xinye:     ['wancheng','xiangyang','runnan'],
        shangyong: ['xiangyang','hanzhong'],
        langya:    ['xiaopei','xiapi','beihai'],
        beihai:    ['pingyuan','langya'],
        wuling:    ['jiangling','chengdu'],
        jiameng:   ['hanzhong','chengdu'],
        puyang:    ['luoyang','chenliu','yecheng'],
    };

    // ============ 狀態 ============
    let currentPlayerId = null;
    let currentPlayerColor = '#4a90d9';
    let worldState = { cities: null, marches: [], players: {} };
    let uiState = { selectedCity: null, marchFrom: null, marchTo: null };
    let canvas, ctx, animationId;
    let mapScale = 1, mapOffsetX = 0, mapOffsetY = 0;

    // ============ localStorage ============
    function loadWorld() {
        try {
            const s = localStorage.getItem('kas-sanguo-world');
            if (s) {
                const parsed = JSON.parse(s);
                // 版本檢查：如果舊存檔沒有 version 或 version 不匹配，清掉重來
                if (!parsed.version || parsed.version < 2) {
                    console.warn('⚠️ 舊存檔不相容，自動清除');
                    localStorage.removeItem('kas-sanguo-world');
                    // 也清掉舊格式
                    localStorage.removeItem('kas-sanguo-save');
                    return false;
                }
                worldState = parsed;
                // 確保 pos/name 來自模板
                for (const [id, city] of Object.entries(worldState.cities || {})) {
                    if (CITIES_TEMPLATE[id]) {
                        city.pos = CITIES_TEMPLATE[id].pos;
                        city.name = CITIES_TEMPLATE[id].name;
                        city.tier = CITIES_TEMPLATE[id].tier;
                        city.production = CITIES_TEMPLATE[id].production;
                    }
                }
                // 加入新城池
                for (const [id, tmpl] of Object.entries(CITIES_TEMPLATE)) {
                    if (!worldState.cities[id]) {
                        worldState.cities[id] = { ...JSON.parse(JSON.stringify(tmpl)), owner: null };
                    }
                }
                return true;
            }
        } catch(e) { console.error('載入世界失敗', e); }
        return false;
    }
    function saveWorld() { try { worldState.version = 2; localStorage.setItem('kas-sanguo-world', JSON.stringify(worldState)); } catch(e) {} }
    function playerCities(pid) { return Object.entries(worldState.cities).filter(([_,c]) => c.owner === pid).map(([id]) => id); }
    function playerKas(pid) { return worldState.players[pid] ? worldState.players[pid].kasBalance : 0; }
    function setKas(pid, v) { if (worldState.players[pid]) worldState.players[pid].kasBalance = v; }

    // ============ 迷霧 BFS ============
    function getVisibleCities(pid) {
        const myCities = playerCities(pid);
        const visible = new Map(); // cityId -> level (2=full, 1=partial, 0=fog)
        // BFS from each owned city
        for (const start of myCities) {
            if (!visible.has(start) || visible.get(start) < 2) visible.set(start, 2);
            // depth 1
            const conn1 = CONNECTIONS[start] || [];
            for (const c1 of conn1) {
                if (!visible.has(c1) || visible.get(c1) < 2) visible.set(c1, 2);
                // depth 2
                const conn2 = CONNECTIONS[c1] || [];
                for (const c2 of conn2) {
                    if (!visible.has(c2) || visible.get(c2) < 1) visible.set(c2, 1);
                }
            }
        }
        return visible;
    }

    // ============ 密碼 hash（簡易） ============
    function simpleHash(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
        return h.toString(36);
    }

    // ============ 登入 ============
    function setupLogin() {
        const btn = document.getElementById('loginBtn');
        const idInput = document.getElementById('loginInput');
        const pwInput = document.getElementById('loginPassword');
        const errorDiv = document.getElementById('loginError');

        function doLogin() {
            const id = idInput.value.trim();
            const pw = pwInput.value.trim();
            if (!id) { showError('請輸入 ID'); return; }
            if (!pw || pw.length < 4 || pw.length > 8 || !/^\d+$/.test(pw)) {
                showError('密碼需為 4-8 位數字'); return;
            }
            const pwHash = simpleHash(id + ':' + pw);

            if (!loadWorld() || !worldState.cities) {
                worldState.cities = JSON.parse(JSON.stringify(CITIES_TEMPLATE));
                for (const c of Object.values(worldState.cities)) c.owner = null;
                worldState.marches = [];
                worldState.players = {};
            }

            if (worldState.players[id]) {
                // 已存在玩家，驗證密碼
                if (worldState.players[id].pwHash !== pwHash) {
                    showError('密碼錯誤！'); return;
                }
            } else {
                // 新玩家
                const usedColors = Object.values(worldState.players).map(p => p.color);
                let color = PLAYER_COLORS.find(c => !usedColors.includes(c)) || PLAYER_COLORS[Math.floor(Math.random() * PLAYER_COLORS.length)];

                // 隨機出生在 C/D 無主城
                const candidates = Object.entries(worldState.cities)
                    .filter(([_,c]) => !c.owner && (c.tier === 'C' || c.tier === 'D'));
                if (candidates.length === 0) { showError('沒有可用的出生城池了！'); return; }
                const [spawnId] = candidates[Math.floor(Math.random() * candidates.length)];
                worldState.cities[spawnId].owner = id;
                worldState.cities[spawnId].garrison = { infantry: 50, cavalry: 0 };

                worldState.players[id] = { color, kasBalance: 100, pwHash };
            }

            currentPlayerId = id;
            currentPlayerColor = worldState.players[id].color;
            saveWorld();

            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('playerDot').style.background = currentPlayerColor;
            document.getElementById('playerName').textContent = id;
            errorDiv.style.display = 'none';

            initGame();
        }

        function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; }

        btn.addEventListener('click', doLogin);
        idInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwInput.focus(); });
        pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    }

    function logout() {
        saveWorld();
        currentPlayerId = null;
        if (animationId) cancelAnimationFrame(animationId);
        document.getElementById('hud').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('loginInput').value = '';
        document.getElementById('loginPassword').value = '';
    }

    // ============ 遊戲初始化 ============
    function initGame() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        gameLoop();
        setInterval(processProduction, CONFIG.PRODUCTION_INTERVAL);
        document.getElementById('loadingScreen').style.display = 'none';
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function calcMapTransform() {
        let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
        for (const c of Object.values(worldState.cities)) {
            minX = Math.min(minX, c.pos.x); maxX = Math.max(maxX, c.pos.x);
            minY = Math.min(minY, c.pos.y); maxY = Math.max(maxY, c.pos.y);
        }
        const pad = 50;
        const mapW = maxX - minX + pad*2, mapH = maxY - minY + pad*2;
        const hudH = 55, availW = canvas.width, availH = canvas.height - hudH;
        mapScale = Math.min(availW / mapW, availH / mapH);
        mapOffsetX = (availW - mapW * mapScale) / 2 - minX * mapScale + pad * mapScale;
        mapOffsetY = hudH + (availH - mapH * mapScale) / 2 - minY * mapScale + pad * mapScale;
    }
    function toScreen(x, y) { return { x: x * mapScale + mapOffsetX, y: y * mapScale + mapOffsetY }; }

    // ============ 主遊戲循環 ============
    function gameLoop() {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        calcMapTransform();

        const vis = getVisibleCities(currentPlayerId);
        drawRoads(vis);
        drawCities(vis);
        drawMarches(vis);
        updateHUD();
        processMarches();
        animationId = requestAnimationFrame(gameLoop);
    }

    // ============ 繪製道路 ============
    function drawRoads(vis) {
        const drawn = new Set();
        for (const [cityId, conns] of Object.entries(CONNECTIONS)) {
            for (const connId of conns) {
                const key = [cityId, connId].sort().join('-');
                if (drawn.has(key)) continue;
                drawn.add(key);

                const c1 = worldState.cities[cityId], c2 = worldState.cities[connId];
                if (!c1 || !c2) continue;

                // 兩端都在迷霧中就不畫
                const v1 = vis.get(cityId) || 0, v2 = vis.get(connId) || 0;
                if (v1 === 0 && v2 === 0) continue;

                const alpha = (v1 >= 1 && v2 >= 1) ? 0.25 : 0.08;
                const p1 = toScreen(c1.pos.x, c1.pos.y), p2 = toScreen(c2.pos.x, c2.pos.y);

                // 己方城池間的道路用藍色
                const bothMine = c1.owner === currentPlayerId && c2.owner === currentPlayerId;

                ctx.strokeStyle = bothMine ? `rgba(74,144,217,${alpha + 0.15})` : `rgba(255,215,0,${alpha})`;
                ctx.lineWidth = bothMine ? 2.5 : 1.5;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
        ctx.setLineDash([]);
    }

    // ============ 繪製城池 ============
    function drawCities(vis) {
        for (const [cityId, city] of Object.entries(worldState.cities)) {
            const fogLevel = vis.get(cityId);
            if (fogLevel === undefined || fogLevel === 0) {
                // 完全迷霧：畫一個很暗的圓
                const sp = toScreen(city.pos.x, city.pos.y);
                const r = tierRadius(city.tier) * mapScale;
                ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(50,50,50,0.3)'; ctx.fill();
                ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,215,0,0.2)';
                ctx.fillText(city.name, sp.x, sp.y - r - 8);
                continue;
            }

            const sp = toScreen(city.pos.x, city.pos.y);
            const r = tierRadius(city.tier) * mapScale;
            const isMine = city.owner === currentPlayerId;

            // 城池顏色
            let cityColor = '#555'; // 無主 / 模糊
            if (city.owner) {
                const ownerData = worldState.players[city.owner];
                cityColor = ownerData ? ownerData.color : '#555';
            }

            // 模糊 → 降低飽和度
            if (fogLevel === 1 && !isMine) {
                cityColor = blendColor(cityColor, '#333', 0.5);
            }

            // 光暈
            const grad = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 1.5);
            grad.addColorStop(0, cityColor + '40');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(sp.x - r*1.5, sp.y - r*1.5, r*3, r*3);

            // 圓
            ctx.beginPath(); ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
            ctx.fillStyle = cityColor; ctx.fill();
            ctx.strokeStyle = isMine ? '#ffd700' : 'rgba(255,215,0,0.4)';
            ctx.lineWidth = isMine ? 2.5 : 1.5;
            ctx.stroke();

            // 名稱
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
            ctx.fillText(city.name, sp.x, sp.y - r - 10);

            // 擁有者名稱（非自己的）
            if (city.owner && !isMine && fogLevel >= 1) {
                ctx.font = '9px Arial'; ctx.fillStyle = cityColor;
                ctx.fillText(city.owner, sp.x, sp.y - r - 1);
            }

            // 兵力
            const total = city.garrison.infantry + city.garrison.cavalry;
            if (total > 0) {
                ctx.font = '10px Arial'; ctx.textAlign = 'center';
                if (isMine) {
                    ctx.fillStyle = '#87ceeb';
                    ctx.fillText(`🛡️${total}`, sp.x, sp.y + r + 16);
                } else if (fogLevel >= 2 && !city.owner) {
                    // NPC 城在完全視野內可見兵力
                    ctx.fillStyle = '#ccc';
                    ctx.fillText(`🛡️${total}`, sp.x, sp.y + r + 16);
                } else {
                    ctx.fillStyle = '#999';
                    ctx.fillText(`🛡️?`, sp.x, sp.y + r + 16);
                }
            }
        }
    }

    function blendColor(hex1, hex2, t) {
        const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
        const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
        const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
        return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    function tierRadius(tier) { return { S:22, A:19, B:16, C:13, D:10 }[tier] || 10; }

    // ============ 繪製行軍 ============
    function drawMarches(vis) {
        const now = Date.now();
        for (const m of worldState.marches) {
            if (m.status !== 'marching') continue;
            const from = worldState.cities[m.from], to = worldState.cities[m.to];
            if (!from || !to) continue;

            // 只畫視野內的行軍
            const progress = Math.min(1, (now - m.startTime) / m.duration);
            const wx = from.pos.x + (to.pos.x - from.pos.x) * progress;
            const wy = from.pos.y + (to.pos.y - from.pos.y) * progress;

            // 判斷行軍位置是否在視野內（簡化：起點或終點在視野就可見）
            const vFrom = vis.get(m.from) || 0, vTo = vis.get(m.to) || 0;
            if (vFrom === 0 && vTo === 0) continue;

            const sp = toScreen(wx, wy);
            const ownerData = worldState.players[m.owner];
            const color = ownerData ? ownerData.color : '#ff6b6b';

            ctx.save();
            ctx.translate(sp.x, sp.y);
            const angle = Math.atan2(to.pos.y - from.pos.y, to.pos.x - from.pos.x);
            ctx.rotate(angle);

            // 箭頭指向前進方向
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(-5, -6);
            ctx.lineTo(-5, 6);
            ctx.closePath();
            ctx.fill();

            ctx.rotate(-angle);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
            if (m.owner === currentPlayerId) {
                ctx.fillText(`⚔️${m.troops.infantry + m.troops.cavalry}`, 0, -14);
            } else {
                ctx.fillText(`⚔️?`, 0, -14);
            }
            ctx.restore();
        }
    }

    // ============ HUD ============
    function updateHUD() {
        const kas = playerKas(currentPlayerId);
        const myCities = playerCities(currentPlayerId);
        document.getElementById('kasBalance').textContent = Math.floor(kas);
        document.getElementById('cityCount').textContent = myCities.length;
        let troops = 0;
        myCities.forEach(cid => {
            const c = worldState.cities[cid];
            if (c) troops += c.garrison.infantry + c.garrison.cavalry;
        });
        document.getElementById('totalTroops').textContent = troops;
    }

    // ============ 點擊 ============
    function handleClick(e) {
        const rect = canvas.getBoundingClientRect();
        findCity(e.clientX - rect.left, e.clientY - rect.top);
    }
    function handleTouch(e) {
        e.preventDefault();
        const t = e.touches[0], rect = canvas.getBoundingClientRect();
        findCity(t.clientX - rect.left, t.clientY - rect.top);
    }
    function findCity(x, y) {
        const vis = getVisibleCities(currentPlayerId);
        for (const [cityId, city] of Object.entries(worldState.cities)) {
            const fogLevel = vis.get(cityId) || 0;
            if (fogLevel === 0) continue; // 迷霧中不可點
            const sp = toScreen(city.pos.x, city.pos.y);
            const d = Math.sqrt((x-sp.x)**2 + (y-sp.y)**2);
            if (d <= tierRadius(city.tier) * mapScale + 8) {
                openCityPanel(cityId, fogLevel);
                return;
            }
        }
    }

    // ============ 城池面板 ============
    function openCityPanel(cityId, fogLevel) {
        const city = worldState.cities[cityId];
        if (!city) return;
        uiState.selectedCity = cityId;

        document.getElementById('cityName').textContent = city.name;
        document.getElementById('cityLevel').textContent = city.tier;
        document.getElementById('cityProduction').textContent = `${city.production}/時`;

        const isMine = city.owner === currentPlayerId;
        const isNeutral = !city.owner;
        const fogWarn = document.getElementById('fogWarning');

        if (isMine) {
            document.getElementById('cityInfantry').textContent = city.garrison.infantry;
            document.getElementById('cityCavalry').textContent = city.garrison.cavalry;
            fogWarn.style.display = 'none';
        } else if (fogLevel >= 2 && isNeutral) {
            document.getElementById('cityInfantry').textContent = city.garrison.infantry;
            document.getElementById('cityCavalry').textContent = city.garrison.cavalry;
            fogWarn.style.display = 'none';
        } else {
            document.getElementById('cityInfantry').textContent = '?';
            document.getElementById('cityCavalry').textContent = '?';
            fogWarn.style.display = fogLevel <= 1 ? 'block' : 'none';
        }

        const actions = document.getElementById('cityActions');
        actions.innerHTML = '';
        if (isMine) {
            actions.innerHTML = `
                <button class="btn" onclick="trainTroops('infantry')">練兵 步兵 (${CONFIG.TROOP_COST.infantry})</button>
                <button class="btn" onclick="trainTroops('cavalry')">練兵 騎兵 (${CONFIG.TROOP_COST.cavalry})</button>
                <button class="btn" onclick="startMarch()">出兵</button>`;
        } else {
            actions.innerHTML = `<button class="btn btn-attack" onclick="startMarch()">攻打此城</button>`;
        }

        document.getElementById('cityPanel').style.display = 'block';
    }

    function closeCityPanel() { document.getElementById('cityPanel').style.display = 'none'; uiState.selectedCity = null; }

    // ============ 練兵 ============
    function trainTroops(type) {
        const cost = CONFIG.TROOP_COST[type];
        const kas = playerKas(currentPlayerId);
        if (kas < cost) { alert('tKAS 不足！'); return; }
        const city = worldState.cities[uiState.selectedCity];
        if (!city || city.owner !== currentPlayerId) return;
        setKas(currentPlayerId, kas - cost);
        city.garrison[type] += 1;
        saveWorld();
        openCityPanel(uiState.selectedCity, 2);
    }

    // ============ 行軍 ============
    function startMarch() {
        const selectedId = uiState.selectedCity;
        const selected = worldState.cities[selectedId];
        if (!selected) return;

        if (selected.owner === currentPlayerId) {
            // 從自己城出兵
            uiState.marchFrom = selectedId;
            closeCityPanel();
            alert('請點擊目標城池');
            canvas.onclick = function(e) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const vis = getVisibleCities(currentPlayerId);
                for (const [cid, city] of Object.entries(worldState.cities)) {
                    if ((vis.get(cid) || 0) === 0) continue;
                    const sp = toScreen(city.pos.x, city.pos.y);
                    if (Math.sqrt((x-sp.x)**2 + (y-sp.y)**2) <= tierRadius(city.tier) * mapScale + 8) {
                        if (cid !== uiState.marchFrom) {
                            uiState.marchTo = cid;
                            showMarchPanel();
                            canvas.onclick = handleClick;
                            return;
                        }
                    }
                }
            };
        } else {
            // 攻打：找最近的自己城
            const myCities = playerCities(currentPlayerId);
            if (myCities.length === 0) { alert('你沒有城池！'); return; }
            let best = myCities[0], bestD = Infinity;
            for (const cid of myCities) {
                const c = worldState.cities[cid];
                const d = Math.sqrt((c.pos.x - selected.pos.x)**2 + (c.pos.y - selected.pos.y)**2);
                if (d < bestD) { bestD = d; best = cid; }
            }
            uiState.marchFrom = best;
            uiState.marchTo = selectedId;
            showMarchPanel();
        }
    }

    function showMarchPanel() {
        const from = worldState.cities[uiState.marchFrom];
        const to = worldState.cities[uiState.marchTo];
        if (!from || !to) return;

        const isTransport = to.owner === currentPlayerId;
        document.getElementById('marchTarget').textContent = to.name + (isTransport ? '（輸送）' : '');
        document.getElementById('availInf').textContent = from.garrison.infantry;
        document.getElementById('availCav').textContent = from.garrison.cavalry;
        const infInput = document.getElementById('marchInf');
        const cavInput = document.getElementById('marchCav');
        infInput.max = from.garrison.infantry; infInput.value = 0;
        cavInput.max = from.garrison.cavalry; cavInput.value = 0;

        // 距離制行軍時間
        const dist = Math.sqrt((to.pos.x - from.pos.x)**2 + (to.pos.y - from.pos.y)**2);
        const minutes = Math.max(1, Math.round(dist / 80));
        document.getElementById('marchTime').textContent = `${minutes}分鐘`;

        function updateCost() {
            const total = (parseInt(infInput.value)||0) + (parseInt(cavInput.value)||0);
            document.getElementById('marchCost').textContent = `${Math.ceil(total * minutes * 0.1)} tKAS`;
        }
        infInput.oninput = updateCost;
        cavInput.oninput = updateCost;
        updateCost();

        closeCityPanel();
        document.getElementById('marchPanel').style.display = 'block';
    }

    function confirmMarch() {
        const inf = parseInt(document.getElementById('marchInf').value) || 0;
        const cav = parseInt(document.getElementById('marchCav').value) || 0;
        if (inf + cav === 0) { alert('請選擇兵力！'); return; }

        const from = worldState.cities[uiState.marchFrom];
        if (from.garrison.infantry < inf || from.garrison.cavalry < cav) { alert('兵力不足！'); return; }

        const to = worldState.cities[uiState.marchTo];
        const dist = Math.sqrt((to.pos.x - from.pos.x)**2 + (to.pos.y - from.pos.y)**2);
        const minutes = Math.max(1, Math.round(dist / 80));
        const cost = Math.ceil((inf + cav) * minutes * 0.1);
        const kas = playerKas(currentPlayerId);
        if (kas < cost) { alert('tKAS 不足！'); return; }

        from.garrison.infantry -= inf;
        from.garrison.cavalry -= cav;
        setKas(currentPlayerId, kas - cost);

        worldState.marches.push({
            id: Date.now().toString(),
            from: uiState.marchFrom, to: uiState.marchTo,
            owner: currentPlayerId,
            troops: { infantry: inf, cavalry: cav },
            startTime: Date.now(),
            duration: minutes * 60 * 1000,
            status: 'marching'
        });

        closeMarchPanel();
        saveWorld();
    }

    function closeMarchPanel() {
        document.getElementById('marchPanel').style.display = 'none';
        uiState.marchFrom = null; uiState.marchTo = null;
    }

    // ============ 行軍到達 ============
    function processMarches() {
        const now = Date.now();
        let changed = false;
        for (const m of worldState.marches) {
            if (m.status !== 'marching') continue;
            if (now < m.startTime + m.duration) continue;

            const target = worldState.cities[m.to];
            if (target.owner === m.owner) {
                // 輸送
                target.garrison.infantry += m.troops.infantry;
                target.garrison.cavalry += m.troops.cavalry;
                if (m.owner === currentPlayerId) showReport(`${target.name} — 輸送完成`, `步兵 +${m.troops.infantry}，騎兵 +${m.troops.cavalry}`, true);
            } else {
                processBattle(m);
            }
            m.status = 'completed';
            changed = true;
        }
        if (changed) {
            worldState.marches = worldState.marches.filter(m => m.status !== 'completed');
            saveWorld();
        }
    }

    // ============ 戰鬥 ============
    function processBattle(march) {
        const atk = march.troops;
        const def = worldState.cities[march.to];
        const defTroops = { infantry: def.garrison.infantry, cavalry: def.garrison.cavalry };

        const atkPower = atk.infantry * CONFIG.TROOP_STATS.infantry.atk + atk.cavalry * CONFIG.TROOP_STATS.cavalry.atk;
        const defPower = (defTroops.infantry * CONFIG.TROOP_STATS.infantry.def + defTroops.cavalry * CONFIG.TROOP_STATS.cavalry.def) * 1.2;

        const prevOwner = def.owner;

        if (atkPower > defPower) {
            const lossRate = (defPower / atkPower) * 0.6;
            const atkLossInf = Math.floor(atk.infantry * lossRate);
            const atkLossCav = Math.floor(atk.cavalry * lossRate);

            def.owner = march.owner;
            def.garrison.infantry = atk.infantry - atkLossInf;
            def.garrison.cavalry = atk.cavalry - atkLossCav;

            const loot = Math.floor(def.production * 2);
            setKas(march.owner, playerKas(march.owner) + loot);

            if (march.owner === currentPlayerId || prevOwner === currentPlayerId) {
                showReport(`${def.name} — ${march.owner === currentPlayerId ? '勝利' : '失守'}`,
                    `攻方損失: 步${atkLossInf} 騎${atkLossCav}<br>守方全滅<br>🏆 城池易主！`, march.owner === currentPlayerId);
            }
        } else {
            const defLossRate = (atkPower / defPower) * 0.4;
            def.garrison.infantry -= Math.floor(defTroops.infantry * defLossRate);
            def.garrison.cavalry -= Math.floor(defTroops.cavalry * defLossRate);

            if (march.owner === currentPlayerId || prevOwner === currentPlayerId) {
                showReport(`${def.name} — ${march.owner === currentPlayerId ? '戰敗' : '守住了'}`,
                    `攻方重大損失`, march.owner !== currentPlayerId);
            }
        }

        checkVictory();
    }

    function showReport(title, html, isVictory) {
        document.getElementById('battleReportContent').innerHTML = `
            <div class="battle-result ${isVictory ? 'victory' : 'defeat'}">${title}</div>
            <div style="text-align:center;margin:10px 0;font-size:14px;color:#ccc">${html}</div>`;
        document.getElementById('battleReportModal').style.display = 'block';
    }
    function closeBattleReport() { document.getElementById('battleReportModal').style.display = 'none'; }

    // ============ 勝利 ============
    function checkVictory() {
        const all = Object.values(worldState.cities);
        if (all.every(c => c.owner === currentPlayerId)) {
            document.getElementById('victoryText').textContent = `恭喜 ${currentPlayerId} 統一天下！佔領全部 ${all.length} 座城池！`;
            document.getElementById('victoryModal').style.display = 'flex';
        }
    }

    // ============ 產出 ============
    function processProduction() {
        if (!currentPlayerId) return;
        loadWorld(); // 同步其他玩家的變動
        for (const [pid, pdata] of Object.entries(worldState.players)) {
            let prod = 0;
            for (const city of Object.values(worldState.cities)) {
                if (city.owner === pid) prod += city.production;
            }
            pdata.kasBalance += prod;
        }
        saveWorld();
    }

    // ============ 重置 ============
    window.resetGame = function() {
        if (confirm('確定重置整個世界？所有玩家進度丟失！')) {
            localStorage.removeItem('kas-sanguo-world');
            location.reload();
        }
    };

    // ============ 啟動 ============
    document.addEventListener('DOMContentLoaded', () => {
        try {
            document.getElementById('loadingScreen').style.display = 'none';
            // 清掉舊格式存檔
            const old = localStorage.getItem('kas-sanguo-save');
            if (old) localStorage.removeItem('kas-sanguo-save');
            setupLogin();
        } catch(e) {
            console.error('啟動失敗:', e);
            alert('遊戲啟動失敗: ' + e.message);
        }
    });
    window.addEventListener('beforeunload', saveWorld);
    </script>
</body>
