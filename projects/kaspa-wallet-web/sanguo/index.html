#ctrl button:active{background:rgba(255,255,255,0.15)}
#bb{position:fixed;bottom:0;left:0;right:0;height:44px;background:rgba(10,10,20,0.9);display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;z-index:10;border-top:1px solid #222}

.pn{background:#16213e;border:1px solid #e94560;border-radius:12px;padding:16px;width:310px;max-width:92vw;max-height:80vh;overflow-y:auto}

.ir{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #282840;font-size:13px}

.pn .cls{background:#333;margin-top:6px}
.tr{display:flex;align-items:center;justify-content:space-between;padding:6px 0}

#minimap{position:fixed;bottom:50px;left:8px;width:100px;height:75px;border:1px solid #444;border-radius:6px;background:rgba(10,10,20,0.85);z-index:10;overflow:hidden}

  <div class="act-btns" id="cp-a"></div>
  <button class="cls" onclick="cpClose()">✕ 關閉</button>
 </div>
</div>

</div>

  const ca=C[a],cb=C[b];
  return Math.sqrt((ca.x-cb.x)**2+(ca.y-cb.y)**2);
}

// 行軍時間（秒）= 距離/速度
function calcMarchTime(fromId,toId,troops){
  const dist=cityDist(fromId,toId);
  let speed=0.8;
  if(troops.c>0&&troops.i===0) speed=1.2; // 純騎兵
  return dist/speed;
}

// 取得鄰接城池
function conn(id){
  const r=[];
  for(const[a,b]of R){if(a===id)r.push(b);if(b===id)r.push(a)}
  return r;
}
function getReachable(id){
  return conn(id).map(tid=>({id:tid,dist:cityDist(id,tid)}));
}

// Sync from world state
function syncFromWorld(){
  if(!world||!myId)return;
  const pd=world.players[myId];
  if(pd) P.tk=pd.tk||0;
  marches=world.marches||[];
  scouts=world.scouts||[];
  scoutIntel=world.scoutIntel||{};
  // Sync city ownership from world
  for(const[id,wc]of Object.entries(world.cities)){
    if(C[id]){C[id].o=wc.o;C[id].g=wc.g;C[id].d=wc.d!==undefined?wc.d:C[id].d}
  }
}
function syncToWorld(){
  if(!world||!myId)return;
  if(!world.players[myId])world.players[myId]={};
  world.players[myId].tk=P.tk;
  world.marches=marches;
  world.scouts=scouts;
  world.scoutIntel=scoutIntel;
  // Sync cities
  for(const[id,c]of Object.entries(C)){
    if(!world.cities[id])world.cities[id]={};
    world.cities[id].o=c.o;world.cities[id].g={...c.g};world.cities[id].d=c.d;
  }
  saveW();
}

// ====== FOG OF WAR ======
// visibility: 0=fog, 1=partial(2 steps), 2=full(adjacent+own)
function calcVis(){
 const vis={};
 // Step 1: own cities = full visibility
 for(const[id,c]of Object.entries(C)){
  if(c.o===myId) vis[id]=2;
 }
 // Step 2: directly connected to own city = partial (scouts/斥候)
 for(const[id,c]of Object.entries(C)){
  if(c.o===myId){
   for(const nb of conn(id)){
    if(!vis[nb]) vis[nb]=1;
   }
  }
 }
 // Step 3: scout intel (full visibility, time-limited)
 const now=Date.now()/1000;
 for(const[cid,exp]of Object.entries(scoutIntel)){
  if(now<exp){if(!vis[cid]||vis[cid]<2) vis[cid]=2}
  else delete scoutIntel[cid];
 }
 return vis;
}
// Recalc every frame (scouts change over time)
function getVis(){ return calcVis(); }
// Fuzzy number display
function fuzzy(n){
 if(n===0)return '0';
 if(n<50)return '少量';
 if(n<150)return '約百';
 if(n<300)return '數百';
 return '大軍';
}
// Is a march visible? (either endpoint or current pos near player vision)
function marchVisible(m){
 const vis=getVis();
 if(vis[m.fr]>=1||vis[m.to]>=1) return true;
 // Check if current position is near any visible city
 const now=Date.now()/1000;
 const pr=Math.min(1,(now-m.st)/(m.at-m.st));
 const f=C[m.fr],t=C[m.to];
 const mx=f.x+(t.x-f.x)*pr,my=f.y+(t.y-f.y)*pr;
 for(const[id,c]of Object.entries(C)){
  if(vis[id]>=2){
   const dx=mx-c.x,dy=my-c.y;
   if(dx*dx+dy*dy<160*160) return true; // within ~4 grid cells
  }
 }
 return false;
}

cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;cam.z=Math.max(ZN,Math.min(ZX,zs*Math.sqrt(dx*dx+dy*dy)/pd))}},{passive:1});
cv.addEventListener('touchend',()=>{pd=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(ZN,Math.min(ZX,cam.z-e.deltaY*0.001))},{passive:0});

// ====== RENDER ======
function draw(){
 cx.clearRect(0,0,W,H);
 cx.fillStyle='#0f0f1a';cx.fillRect(0,0,W,H);

 // Grid (aligned to GS=40)
 const tl=s2w(0,0),br=s2w(W,H);
 // Major grid lines (every 5 cells = 200px)
 cx.strokeStyle='rgba(255,255,255,0.03)';cx.lineWidth=1;
 const mgs=GS*5;
 for(let gx=Math.floor(tl.x/mgs)*mgs;gx<=br.x;gx+=mgs){const s=w2s(gx,0);cx.beginPath();cx.moveTo(s.x,0);cx.lineTo(s.x,H);cx.stroke()}
 for(let gy=Math.floor(tl.y/mgs)*mgs;gy<=br.y;gy+=mgs){const s=w2s(0,gy);cx.beginPath();cx.moveTo(0,s.y);cx.lineTo(W,s.y);cx.stroke()}
 // Minor grid (every cell, only when zoomed in)
 if(cam.z>0.8){
  cx.strokeStyle='rgba(255,255,255,0.015)';
  for(let gx=Math.floor(tl.x/GS)*GS;gx<=br.x;gx+=GS){const s=w2s(gx,0);cx.beginPath();cx.moveTo(s.x,0);cx.lineTo(s.x,H);cx.stroke()}
  for(let gy=Math.floor(tl.y/GS)*GS;gy<=br.y;gy+=GS){const s=w2s(0,gy);cx.beginPath();cx.moveTo(0,s.y);cx.lineTo(W,s.y);cx.stroke()}
 }
 // Grid coord labels on major lines (when zoomed)
 if(cam.z>0.6){
  cx.fillStyle='rgba(255,255,255,0.08)';cx.font='9px sans-serif';cx.textAlign='left';
  for(let gx=Math.floor(tl.x/mgs)*mgs;gx<=br.x;gx+=mgs){
   const s=w2s(gx,Math.max(tl.y,0));
   cx.fillText(Math.round(gx/GS),s.x+2,Math.max(s.y+12,54));
  }
 }

 // Region labels (text only, no circles)
 if(cam.z>0.35){
  for(const rg of REGIONS){
   const s=w2s(rg.x,rg.y);
   cx.fillStyle='rgba(255,255,255,0.08)';
   cx.font=`bold ${Math.max(10,16*cam.z)}px sans-serif`;cx.textAlign='center';
   cx.fillText(rg.n,s.x,s.y+5*cam.z);
  }
 }

 // (Mountains now rendered via MTN_ZONES in fog section)

 // (Rivers hidden for cleaner map)

 // === FOG OF WAR ===
 const vis=getVis();

 // Mountain labels (text only, no circles)
 if(cam.z>0.5){
  cx.fillStyle='rgba(160,130,80,0.25)';cx.textAlign='center';
  cx.font=`${9*cam.z}px sans-serif`;
  for(const mtn of MTN_ZONES){
   const s=w2s(mtn.x,mtn.y);
   if(s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)continue;
   cx.fillText('⛰️'+mtn.n,s.x,s.y);
  }
 }

 // Roads
 for(const[a,b]of R){
  const ca=C[a],cb=C[b];if(!ca||!cb)continue;
  const sa=w2s(ca.x,ca.y),sb=w2s(cb.x,cb.y);
  const va=vis[a]||0,vb=vis[b]||0;
  const maxV=Math.max(va,vb);
  if(maxV===0){cx.strokeStyle='rgba(255,255,255,0.08)'}
  else if(maxV===1){cx.strokeStyle='rgba(255,255,255,0.25)'}
  else{cx.strokeStyle='rgba(255,255,255,0.4)'}
  cx.lineWidth=2*cam.z;
  cx.beginPath();cx.moveTo(sa.x,sa.y);cx.lineTo(sb.x,sb.y);cx.stroke();
 }

 // Scouts on map
 const now=Date.now()/1000;
 for(const sc of scouts){
  const pr=Math.min(1,(now-sc.st)/(sc.at-sc.st));
  const from=C[sc.phase==='go'?sc.fr:sc.to],to=C[sc.phase==='go'?sc.to:sc.fr];
  const sx2=from.x+(to.x-from.x)*pr,sy2=from.y+(to.y-from.y)*pr;
  const s=w2s(sx2,sy2);
  const goingRight=to.x>from.x;
  cx.save();
  cx.translate(s.x,s.y);
  if(!goingRight) cx.scale(-1,1); // 🏇 預設朝右，往左時翻轉
  cx.font=`${14*cam.z}px sans-serif`;cx.textAlign='center';
  cx.fillText('🏇',0,0);
  cx.restore();
 }

 // Marches (only visible ones)
 for(const m of marches){
  if(!marchVisible(m))continue;
  const pr=Math.min(1,(now-m.st)/(m.at-m.st));
  const f=C[m.fr],t=C[m.to];
  const mx=f.x+(t.x-f.x)*pr,my=f.y+(t.y-f.y)*pr;
  const s=w2s(mx,my);
  cx.font=`${18*cam.z}px sans-serif`;cx.textAlign='center';cx.fillText('⚔️',s.x,s.y);
 }

 // Cities (with fog of war)
 for(const[id,c]of Object.entries(C)){
  const s=w2s(c.x,c.y),r=TR[c.t]*cam.z;
  if(s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)continue;
  const v=vis[id]||0;
  const isOtherPlayer=c.o&&c.o!=='npc'&&c.o!==myId; // 其他玩家的城
  const isMyCity=c.o===myId;
  // 其他玩家的城：永遠可見（顏色+名稱），但兵力未知
  const cityVisible=v>0||isOtherPlayer||isMyCity;

  // Selection glow
  if(id===selCity){cx.beginPath();cx.arc(s.x,s.y,r+5*cam.z,0,Math.PI*2);cx.fillStyle='rgba(255,215,0,0.25)';cx.fill()}

  // City dot
  cx.beginPath();cx.arc(s.x,s.y,r,0,Math.PI*2);
  if(!cityVisible){
   // 完全迷霧中的 NPC 城
   cx.fillStyle='rgba(40,40,50,0.6)';cx.fill();
   cx.strokeStyle='rgba(100,100,100,0.3)';cx.lineWidth=1*cam.z;cx.stroke();
  }else if(isOtherPlayer&&v===0){
   // 迷霧中的其他玩家城 — 顯示顏色但稍暗
   cx.fillStyle=ownerColor(c.o);cx.globalAlpha=0.6;cx.fill();cx.globalAlpha=1;
   cx.strokeStyle=TC[c.t];cx.globalAlpha=0.4;cx.lineWidth=1.5*cam.z;cx.stroke();cx.globalAlpha=1;
  }else if(v===1){
   cx.fillStyle=ownerColor(c.o)||'#555';cx.globalAlpha=0.7;cx.fill();cx.globalAlpha=1;
   cx.strokeStyle=TC[c.t];cx.globalAlpha=0.6;cx.lineWidth=1.5*cam.z;cx.stroke();cx.globalAlpha=1;
  }else{
   cx.fillStyle=ownerColor(c.o)||'#555';cx.fill();
   cx.strokeStyle=TC[c.t];cx.lineWidth=1.5*cam.z;cx.stroke();
  }

  // Name
  if(cam.z>0.4){
   if(!cityVisible){
    cx.fillStyle='rgba(255,255,255,0.2)';
   }else if(isOtherPlayer&&v===0){
    cx.fillStyle='rgba(255,255,255,0.6)';
   }else{
    cx.fillStyle=v===0?'rgba(255,255,255,0.2)':v===1?'rgba(255,255,255,0.7)':'#fff';
   }
   cx.font=`bold ${Math.max(8,11*cam.z)}px sans-serif`;cx.textAlign='center';
   cx.fillText(c.n,s.x,s.y+3*cam.z);
   // 其他玩家城顯示擁有者名稱
   if(isOtherPlayer&&cam.z>0.5){
    cx.fillStyle=ownerColor(c.o);cx.font=`${8*cam.z}px sans-serif`;
    cx.fillText(c.o,s.x,s.y-r-12*cam.z);
   }
   if(cam.z>0.9&&v>=2){
    cx.fillStyle='rgba(255,255,255,0.3)';cx.font=`${7*cam.z}px sans-serif`;
    cx.fillText(`(${c.gx},${c.gy})`,s.x,s.y+r+20*cam.z);
   }
  }

  // Tier + garrison (fog-aware)
  if(cam.z>0.55){
   if(cityVisible&&(v>=1||isOtherPlayer)){cx.fillStyle=TC[c.t];cx.globalAlpha=(v<=1&&!isMyCity)?0.4:1;cx.font=`bold ${9*cam.z}px sans-serif`;cx.textAlign='center';cx.fillText(c.t,s.x,s.y-r-3*cam.z);cx.globalAlpha=1}
   cx.font=`${8*cam.z}px sans-serif`;cx.textAlign='center';
   if(isMyCity&&v>=2){
    // 自己城：顯示完整兵力
    const tot=(c.g.i||0)+(c.g.c||0);
    cx.fillStyle='rgba(255,255,255,0.5)';cx.fillText(tot,s.x,s.y+r+10*cam.z);
   }else if(isOtherPlayer){
    // 其他玩家城：永遠顯示 ?
    cx.fillStyle='rgba(255,255,255,0.3)';cx.fillText('？',s.x,s.y+r+10*cam.z);
   }else if(v===2){
    // NPC 城在完全視野
    const tot=(c.g.i||0)+(c.g.c||0);
    cx.fillStyle='rgba(255,255,255,0.5)';cx.fillText(tot,s.x,s.y+r+10*cam.z);
   }else if(v===1){
    const tot=(c.g.i||0)+(c.g.c||0);
    cx.fillStyle='rgba(255,255,255,0.3)';cx.fillText(fuzzy(tot),s.x,s.y+r+10*cam.z);
   }else{
    cx.fillStyle='rgba(255,255,255,0.15)';cx.fillText('？',s.x,s.y+r+10*cam.z);
   }
  }
 }

// 派遣斥候
function sendScout(fromId,toId){
 if(P.tk<SCOUT_COST){toast('❌ tKAS 不足（需要 '+SCOUT_COST+'）');return}
 P.tk-=SCOUT_COST;
 const dist=cityDist(fromId,toId);
 const travelTime=dist/SCOUT_SPEED;
 const now=Date.now()/1000;
 scouts.push({fr:fromId,to:toId,st:now,at:now+travelTime,phase:'go'});
 const secs=Math.round(travelTime);
 toast(`🏇 斥候出發 → ${C[toId].n}（${secs}秒後到達，回程再${secs}秒）`);
 syncToWorld();hud();cpClose();
}
window.sendScout=sendScout;

function battle(m){
 const c=C[m.to];
 const owner=m.owner||myId;
 // 自己城池 = 輸送
 if(c.o===owner){
  c.g.i+=m.tr.i;c.g.c+=m.tr.c;
  if(owner===myId) toast(`📦 ${c.n} 輸送完成 +🗡️${m.tr.i} 🐴${m.tr.c}`);
  syncToWorld();hud();return;
 }
 let ap=m.tr.i*TP.i.a+m.tr.c*TP.c.a;
 let dp=(c.g.i*TP.i.df+c.g.c*TP.c.df)*(1+c.d*0.1);
 if(ap>dp){
  c.o=owner;c.g={i:m.tr.i,c:m.tr.c};
  const l=c.p*2;
  if(owner===myId){P.tk+=l;toast(`✅ 佔領 ${c.n}！+${l} tKAS`)}
 }else{
  if(owner===myId) toast(`❌ 攻打 ${c.n} 失敗！`);
 }
 syncToWorld();hud();
}

// ====== PANELS ======
function cpShow(id){
 const c=C[id];
 const icon=c.t==='S'?'🏯':c.t<='B'?'🏰':'🏘';
 document.getElementById('cp-t').textContent=`${icon} ${c.n} (${c.t}級)`;
 const tot=(c.g.i||0)+(c.g.c||0);
 const v=(getVis())[id]||0;
 const garText=v===2?`🗡️${c.g.i} 🐴${c.g.c} (${tot})`:v===1?`${fuzzy(tot)} (情報不明)`:'❓ 未知';
 const defText=v>=2?`🛡️Lv.${c.d}`:v===1?'🛡️ 不明':'❓';
 document.getElementById('cp-i').innerHTML=`
  <div class="ir"><span>座標</span><span style="color:#888">(${c.gx},${c.gy})</span></div>
  <div class="ir"><span>所屬</span><span style="color:${ownerColor(c.o)}">${c.o===myId?'👑 己方':c.o==='npc'?c.r:'⚔️ '+c.o}</span></div>
  <div class="ir"><span>駐軍</span><span>${garText}</span></div>
  <div class="ir"><span>產出</span><span>💰${v>=1?c.p+'':' ？'}/時</span></div>
  <div class="ir"><span>城防</span><span>${defText}</span></div>
  ${v<2?'<div style="text-align:center;color:#e94560;font-size:11px;padding:4px">🌫️ 情報有限 — 派斥候偵查或佔領鄰城</div>':''}`;
 let a='';
 if(c.o===myId){
  a=`<button onclick="tpOpen('${id}')">⚔️ 訓練</button>
  <button onclick="upDef('${id}')">🛡️ 升城防(${10*(c.d+1)})</button>
  <button onclick="mpOpen('${id}')">🐴 出兵</button>`;
 }else{
  const canAtk=conn(id).some(cid=>C[cid]&&C[cid].o===myId);
  if(canAtk)a=`<button onclick="mpOpenTo('${id}')">⚔️ 攻打</button>`;
  // 斥候：己方城池鄰接的非己方城池可派斥候
  const myCity=conn(id).find(cid=>C[cid]&&C[cid].o===myId);
  if(myCity&&v<2)a+=`<button onclick="sendScout('${myCity}','${id}')">🏇 派斥候 (${SCOUT_COST}💰)</button>`;
 }
 document.getElementById('cp-a').innerHTML=a;
 document.getElementById('city-panel').classList.add('act');
}
function cpClose(){document.getElementById('city-panel').classList.remove('act')}

let trainCity=null;
function tpOpen(id){trainCity=id;cpClose();document.getElementById('ti').value=10;document.getElementById('tc').value=5;tpCost();document.getElementById('train-panel').classList.add('act')}
function tpClose(){document.getElementById('train-panel').classList.remove('act')}
function tpCost(){const i=+(document.getElementById('ti').value)||0,c=+(document.getElementById('tc').value)||0;document.getElementById('t-cost').textContent=`費用: ${Math.ceil(i*1.5+c*3)} tKAS`}
function tpOk(){
 const i=+(document.getElementById('ti').value)||0,cv2=+(document.getElementById('tc').value)||0;
 const cost=Math.ceil(i*1.5+cv2*3);
 if(cost>P.tk){toast('❌ tKAS 不足');return}
 const c=C[trainCity];P.tk-=cost;c.g.i+=i;c.g.c+=cv2;
 toast(`✅ 🗡️${i} 🐴${cv2} 訓練完成`);syncToWorld();hud();tpClose();
}
function upDef(id){
 const c=C[id],cost=10*(c.d+1);
 if(c.d>=10){toast('已滿級');return}
 if(P.tk<cost){toast('❌ tKAS 不足');return}
 P.tk-=cost;c.d++;toast(`🛡️ ${c.n} Lv.${c.d}`);syncToWorld();hud();cpShow(id);
}
function mpOpen(fid){
 marchSrc=fid;cpClose();const c=C[fid];
 document.getElementById('m-from').textContent=`從: ${c.n}`;
 document.getElementById('mi').value=0;document.getElementById('mi').max=c.g.i;
 document.getElementById('mc2').value=0;document.getElementById('mc2').max=c.g.c;
 const sel=document.getElementById('m-tgt');sel.innerHTML='';
 const targets=getReachable(fid);
 const v=getVis();
 for(const{id:tid,dist}of targets){
  const t=C[tid];if(!t)continue;
  const tv=v[tid]||0;
  const o=document.createElement('option');o.value=tid;
  const garInfo=tv>=2?` 兵${(t.g.i||0)+(t.g.c||0)}`:tv===1?` ${fuzzy((t.g.i||0)+(t.g.c||0))}`:'';
  o.textContent=`${t.n}${t.o===myId?' (己方)':''}${garInfo}`;
  sel.appendChild(o);
 }
 document.getElementById('march-panel').classList.add('act');
}
function mpOpenTo(tid){
 cpClose();
 const pc=conn(tid).find(cid=>C[cid]&&C[cid].o===myId);
 if(!pc){toast('❌ 無鄰近己城');return}
 mpOpen(pc);document.getElementById('m-tgt').value=tid;
}
function mpClose(){document.getElementById('march-panel').classList.remove('act')}
function mpOk(){
 const i=+(document.getElementById('mi').value)||0,cv2=+(document.getElementById('mc2').value)||0;
 const tid=document.getElementById('m-tgt').value;
 if(i+cv2===0){toast('❌ 請派兵');return}
 if(!tid){toast('❌ 選目標');return}
 const c=C[marchSrc];
 if(i>c.g.i||cv2>c.g.c){toast('❌ 兵力不足');return}
 const sc=Math.max(1,Math.round((i+cv2)*0.05));
 if(P.tk<sc){toast('❌ 糧草不足');return}
 c.g.i-=i;c.g.c-=cv2;P.tk-=sc;
 const mt=calcMarchTime(marchSrc,tid,{i,c:cv2});
 const now=Date.now()/1000;
 marches.push({fr:marchSrc,to:tid,tr:{i,c:cv2},st:now,at:now+mt,owner:myId});
 const mins=Math.round(mt/60);
 toast(`🐴 → ${C[tid].n}！${mins>0?mins+'分':Math.round(mt)+'秒'}`);syncToWorld();hud();mpClose();
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000)}

// Find panel
function fpOpen(){
 const list=document.getElementById('fp-list');
 // Group by region
 const groups={};
 for(const[id,c]of Object.entries(C)){
  if(!groups[c.r])groups[c.r]=[];
  groups[c.r].push({id,...c});
 }
 let html='';
 for(const[region,cities]of Object.entries(groups)){
  html+=`<div style="color:#ffd700;font-size:12px;padding:6px 0 2px;border-bottom:1px solid #333">${region}</div>`;
  for(const c of cities.sort((a,b)=>a.t.localeCompare(b.t))){
   const clr=ownerColor(c.o)||'#555';
   html+=`<div onclick="fpJump('${c.id}')" style="display:flex;justify-content:space-between;padding:5px 4px;cursor:pointer;font-size:12px;border-bottom:1px solid #1a1a2e">
    <span style="color:${clr}">${TC[c.t]?'<span style=color:'+TC[c.t]+'>'+c.t+'</span> ':''} ${c.n}</span>
    <span style="color:#666">(${c.gx},${c.gy})</span>
   </div>`;
  }
 }
 list.innerHTML=html;
 document.getElementById('find-panel').classList.add('act');
}
function fpClose(){document.getElementById('find-panel').classList.remove('act')}
function fpGo(){
 const gx=+(document.getElementById('fp-x').value)||0;
 const gy=+(document.getElementById('fp-y').value)||0;
 cam.x=gx*GS;cam.y=gy*GS;cam.z=1.2;
 fpClose();
 // Check if city at this coord
 for(const[id,c]of Object.entries(C)){
  if(c.gx===gx&&c.gy===gy){selCity=id;toast(`📍 ${c.n} (${gx},${gy})`);return}
 }
 toast(`📍 前往 (${gx},${gy})`);
}
function fpJump(id){
 const c=C[id];cam.x=c.x;cam.y=c.y;cam.z=1.2;selCity=id;fpClose();toast(`📍 ${c.n} (${c.gx},${c.gy})`);
}

const G={zi(){cam.z=Math.min(ZX,cam.z+ZS)},zo(){cam.z=Math.max(ZN,cam.z-ZS)},home(){goHome()},find(){fpOpen()}};

// ====== 登入系統 ======
function setupLogin(){
 const btn=document.getElementById('li-btn');
 const idIn=document.getElementById('li-id');
 const pwIn=document.getElementById('li-pw');
 const errDiv=document.getElementById('li-err');

 function showErr(m){errDiv.textContent=m;errDiv.style.display='block'}

 function doLogin(){
  const id=idIn.value.trim();
  const pw=pwIn.value.trim();
  if(!id){showErr('請輸入 ID');return}
  if(!pw||pw.length<4||pw.length>8||!/^\d+$/.test(pw)){showErr('密碼需為 4-8 位數字');return}
  const pwHash=sHash(id+':'+pw);

  if(!loadW()){initWorld()}

  if(world.players[id]){
   // 驗證密碼
   if(world.players[id].pwHash!==pwHash){showErr('密碼錯誤！');return}
  }else{
   // 新玩家
   const usedColors=Object.values(world.players).map(p=>p.color);
   const color=PCOLORS.find(c=>!usedColors.includes(c))||PCOLORS[Math.floor(Math.random()*PCOLORS.length)];

   // 隨機出生在 C/D 無主城
   const candidates=Object.entries(C).filter(([cid])=>{
    const wc=world.cities[cid];
    const ow=wc?wc.o:C[cid].o;
    return (ow==='npc'||!ow)&&(C[cid].t==='C'||C[cid].t==='D');
   });
   if(candidates.length===0){showErr('沒有可用的出生城池！');return}
   const[spawnId]=candidates[Math.floor(Math.random()*candidates.length)];

   world.players[id]={color,tk:100,pwHash};
   world.cities[spawnId]={o:id,g:{i:50,c:0},d:world.cities[spawnId]?world.cities[spawnId].d:1};
  }

  myId=id;
  myColor=world.players[id].color;
  syncFromWorld();
  syncToWorld(); // 存檔！讓其他玩家能讀到

  document.getElementById('loginModal').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('p-dot').style.background=myColor;
  document.getElementById('p-name').textContent=id;
  errDiv.style.display='none';

  goHome();hud();draw();
 }

 btn.addEventListener('click',doLogin);
 idIn.addEventListener('keydown',e=>{if(e.key==='Enter')pwIn.focus()});
 pwIn.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}

function doLogout(){
 syncToWorld();
 myId=null;
 document.getElementById('hud').style.display='none';
 document.getElementById('loginModal').style.display='flex';
 document.getElementById('li-id').value='';
 document.getElementById('li-pw').value='';
}

// 產出和行軍改為 sync
function startGameTimers(){
 // Production
 setInterval(()=>{
  if(!myId)return;
  loadW();syncFromWorld();
  let pr=0;for(const c of Object.values(C))if(c.o===myId)pr+=c.p;
  if(pr>0){const g=Math.max(1,Math.round(pr/60));P.tk+=g;toast(`💰 +${g} tKAS`);syncToWorld();hud()}
 },60000);

 // March
 setInterval(()=>{
  if(!myId)return;
  const now=Date.now()/1000;const done=[];
  for(let i=0;i<marches.length;i++)if(now>=marches[i].at){done.push(i);battle(marches[i])}
  for(let i=done.length-1;i>=0;i--)marches.splice(done[i],1);
  if(done.length>0)syncToWorld();
 },1000);

 // Scouts
 setInterval(()=>{
  if(!myId)return;
  const now=Date.now()/1000;const done=[];
  for(let i=0;i<scouts.length;i++){
   const sc=scouts[i];
   if(now>=sc.at){
    if(sc.phase==='go'){
     const dist=cityDist(sc.fr,sc.to);
     sc.phase='back';sc.st=now;sc.at=now+dist/SCOUT_SPEED;
    }else{
     done.push(i);
     scoutIntel[sc.to]=now+SCOUT_INTEL_DURATION;
     const t=C[sc.to];
     const tot=(t.g.i||0)+(t.g.c||0);
     toast(`🏇 斥候回報：${t.n} — 🗡️${t.g.i} 🐴${t.g.c}（共${tot}）城防Lv.${t.d}`);
    }
   }
  }
  for(let i=done.length-1;i>=0;i--)scouts.splice(done[i],1);
  if(done.length>0)syncToWorld();
 },1000);
}

// Periodic sync (pick up other player's changes)
setInterval(()=>{if(myId){loadW();syncFromWorld();hud()}},5000);

// ====== INIT ======
setupLogin();
startGameTimers();
window.addEventListener('beforeunload',()=>{if(myId)syncToWorld()});
</script>
