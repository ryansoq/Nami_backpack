<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 娜米的英雄世界 v4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a1a;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid #ffd700;
        }
        
        .header h1 {
            font-size: 16px;
            color: #ffd700;
        }
        
        .header-stats {
            display: flex;
            gap: 15px;
            font-size: 11px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        .status-dot.live { background: #27ae60; }
        .status-dot.idle { background: #f39c12; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 45px);
        }
        
        /* ========== 左側：戰鬥區 ========== */
        .battle-zone {
            width: 33%;
            background: linear-gradient(180deg, #1a0a2e 0%, #16213e 100%);
            border-right: 3px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        .battle-title {
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-bottom: 2px solid #e74c3c;
            font-size: 12px;
            color: #e74c3c;
            text-align: center;
        }
        
        #battleCanvas {
            width: 100%;
            height: 180px;
            min-height: 150px;
            max-height: 200px;
            image-rendering: pixelated;
        }
        
        .battle-info-panel {
            padding: 8px;
            background: rgba(0,0,0,0.7);
            font-size: 10px;
        }
        
        .fighter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0;
        }
        
        .fighter-name {
            color: #ffd700;
            font-weight: bold;
        }
        
        .fighter-name.blue { color: #3498db; }
        .fighter-name.red { color: #e74c3c; }
        
        .hp-bar-mini {
            width: 80px;
            height: 8px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .hp-bar-mini .fill {
            height: 100%;
            background: #27ae60;
            transition: width 0.2s;
        }
        
        .hp-bar-mini .fill.danger { background: #e74c3c; }
        
        .battle-log {
            flex: 1;
            min-height: 150px;
            overflow-y: auto;
            font-size: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid #333;
        }
        
        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #222;
        }
        
        .log-line.attack { color: #e74c3c; }
        .log-line.skill { color: #9b59b6; }
        .log-line.evade { color: #3498db; }
        .log-line.death { color: #e74c3c; font-weight: bold; }
        
        /* ========== 右側：世界區 ========== */
        .world-zone {
            width: 67%;
            position: relative;
            overflow: hidden;
            background: url('world_tree.png') center center / cover no-repeat;
        }
        
        .world-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.6);
            pointer-events: none;
        }
        
        #worldCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .world-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 10px;
        }
        
        /* ========== 控制面板 ========== */
        .control-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 5px;
        }
        
        .ctrl-btn {
            background: rgba(0,0,0,0.7);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 5px 10px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .ctrl-btn:hover {
            background: rgba(255,215,0,0.2);
        }
        
        .ctrl-btn.active {
            background: rgba(39,174,96,0.5);
            border-color: #27ae60;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>🌲 娜米的英雄世界</h1>
        <div class="header-stats">
            <div class="stat-item">
                <span class="status-dot idle" id="statusDot"></span>
                <span id="statusText">等待中</span>
            </div>
            <div class="stat-item">🦸 存活: <span id="aliveCount">0</span></div>
            <div class="stat-item">⚔️ 戰鬥: <span id="battleCount">0</span></div>
        </div>
    </header>
    
    <div class="main-container">
        <!-- 左側：戰鬥區 -->
        <div class="battle-zone">
            <div class="battle-title">⚔️ 戰鬥舞台</div>
            <canvas id="battleCanvas"></canvas>
            <div class="battle-info-panel">
                <div class="fighter-row">
                    <span class="fighter-name blue" id="leftFighterName">等待中...</span>
                    <div class="hp-bar-mini">
                        <div class="fill" id="leftHpBar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="fighter-row">
                    <span class="fighter-name red" id="rightFighterName">等待中...</span>
                    <div class="hp-bar-mini">
                        <div class="fill" id="rightHpBar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            <div class="battle-log" id="battleLog">
                <div class="log-line">🌲 等待戰鬥...</div>
            </div>
        </div>
        
        <!-- 右側：世界區 -->
        <div class="world-zone">
            <canvas id="worldCanvas"></canvas>
            <div class="world-overlay">
                🌲 大地之樹守護著英雄們
            </div>
            <div class="control-bar">
                <button class="ctrl-btn" onclick="toggleAutoFetch()" id="autoFetchBtn">📡 監聽</button>
                <button class="ctrl-btn" onclick="fetchBattle()">🔄 檢查</button>
                <button class="ctrl-btn" onclick="spawnTestHero()">✨ 測試</button>
            </div>
        </div>
    </div>

<script>
// ============ 設定 ============
const BATTLE_URL = 'battles/latest.json';
const HEROES_URL = 'heroes/alive.json';
const POLL_INTERVAL = 3000;

// ============ Canvas 設定 ============
const battleCanvas = document.getElementById('battleCanvas');
const battleCtx = battleCanvas.getContext('2d');
const worldCanvas = document.getElementById('worldCanvas');
const worldCtx = worldCanvas.getContext('2d');

// ============ 遊戲狀態 ============
const game = {
    // 戰鬥狀態
    battle: null,
    battleId: null,
    isPlaying: false,
    playTick: 0,
    eventIndex: 0,
    leftFighter: null,
    rightFighter: null,
    battleParticles: [],
    damageNumbers: [],
    
    // 世界狀態
    worldHeroes: [],
    autoFetch: false,
    autoFetchTimer: null,
    battleCount: 0,
    
    // 視覺
    screenShake: 0
};

// 職業配色
const CLASS_COLORS = {
    knight: { main: '#f39c12', accent: '#f1c40f', name: '騎士' },
    mage: { main: '#2980b9', accent: '#3498db', name: '法師' },
    archer: { main: '#27ae60', accent: '#2ecc71', name: '弓手' },
    rogue: { main: '#8e44ad', accent: '#9b59b6', name: '盜賊' }
};

// 稀有度背景效果
const RARITY_EFFECTS = {
    common: { glow: null, color: '#7f8c8d', particles: 0 },
    uncommon: { glow: 'rgba(127,140,141,0.3)', color: '#95a5a6', particles: 2 },
    rare: { glow: 'rgba(52,152,219,0.4)', color: '#3498db', particles: 4 },
    epic: { glow: 'rgba(155,89,182,0.5)', color: '#9b59b6', particles: 6 },
    legendary: { glow: 'rgba(241,196,15,0.6)', color: '#f1c40f', particles: 8 },
    mythic: { glow: 'rgba(231,76,60,0.7)', color: '#e74c3c', particles: 12 }
};

// 載入職業圖片
const heroImages = {};
const imageUrls = {
    knight: 'knight.png',
    mage: 'mage.png', 
    archer: 'archer.png',
    rogue: 'rogue.png'
};

let imagesLoaded = 0;
Object.entries(imageUrls).forEach(([key, url]) => {
    const img = new Image();
    img.onload = () => {
        imagesLoaded++;
        console.log(`✅ 載入 ${key} 圖片`);
    };
    img.src = url;
    heroImages[key] = img;
});

// ============ 調整 Canvas 大小 ============
function resizeCanvases() {
    const battleZone = document.querySelector('.battle-zone');
    const worldZone = document.querySelector('.world-zone');
    
    battleCanvas.width = battleZone.clientWidth;
    battleCanvas.height = 180; // 固定高度
    
    worldCanvas.width = worldZone.clientWidth;
    worldCanvas.height = worldZone.clientHeight;
}

window.addEventListener('resize', resizeCanvases);

// ============ 戰鬥者類別 ============
class BattleFighter {
    constructor(data, side) {
        this.data = data;
        this.side = side;
        this.x = side === 'left' ? battleCanvas.width * 0.25 : battleCanvas.width * 0.75;
        this.y = battleCanvas.height * 0.7;
        this.baseX = this.x;
        
        this.hp = 100;
        this.maxHp = 100;
        this.state = 'idle';
        this.stateTimer = 0;
        this.animFrame = 0;
        this.direction = side === 'left' ? 1 : -1;
        
        this.classData = CLASS_COLORS[data.class] || CLASS_COLORS.warrior;
    }
    
    update() {
        this.animFrame += 0.15;
        
        if (this.stateTimer > 0) {
            this.stateTimer--;
            if (this.stateTimer <= 0) {
                this.state = 'idle';
                this.x = this.baseX;
            }
        }
        
        if (this.state === 'attack') {
            const progress = 1 - (this.stateTimer / 20);
            if (progress < 0.4) {
                this.x = this.baseX + this.direction * 40 * (progress / 0.4);
            } else {
                this.x = this.baseX + this.direction * 40 * (1 - (progress - 0.4) / 0.6);
            }
        }
    }
    
    attack() { this.state = 'attack'; this.stateTimer = 20; }
    skill() { this.state = 'skill'; this.stateTimer = 30; }
    hurt() { this.state = 'hurt'; this.stateTimer = 10; game.screenShake = 5; }
    die() { this.state = 'dead'; this.hp = 0; }
    
    draw(ctx) {
        const x = Math.floor(this.x);
        const y = Math.floor(this.y);
        const img = heroImages[this.data.class];
        const rarity = this.data.rarity?.toLowerCase() || 'common';
        const effect = RARITY_EFFECTS[rarity] || RARITY_EFFECTS.common;
        
        ctx.save();
        
        if (this.state === 'dead') ctx.globalAlpha = 0.4;
        if (this.state === 'hurt' && this.stateTimer % 4 < 2) ctx.globalAlpha = 0.3;
        
        const bounce = this.state === 'idle' ? Math.sin(this.animFrame) * 2 : 0;
        const size = 64; // 圖片大小
        
        // 稀有度光暈
        if (effect.glow) {
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = 15 + Math.sin(Date.now() / 300) * 5;
            ctx.fillStyle = effect.glow;
            ctx.beginPath();
            ctx.arc(x, y - size/2 + bounce, size/2 + 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // 陰影
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 5, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 繪製圖片
        if (img && img.complete) {
            ctx.save();
            ctx.translate(x, y - size/2 + bounce);
            if (this.direction < 0) ctx.scale(-1, 1);
            ctx.drawImage(img, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            // 備用：畫方塊
            ctx.fillStyle = this.classData.main;
            ctx.fillRect(x - 15, y - 50 + bounce, 30, 50);
        }
        
        // 攻擊特效
        if (this.state === 'attack' || this.state === 'skill') {
            ctx.fillStyle = this.state === 'skill' ? '#9b59b6' : '#ff6600';
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(x + this.direction * 30, y - 30, 15, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.restore();
    }
}

// ============ 世界英雄類別 ============
class WorldHero {
    constructor(data, x, y) {
        this.data = data;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.targetX = null;
        this.state = 'idle';
        this.stateTimer = 0;
        this.animFrame = Math.random() * 10;
        this.direction = 1;
        this.speechBubble = null;
        this.speechTimer = 0;
        
        this.classData = CLASS_COLORS[data.class] || CLASS_COLORS.warrior;
        this.decideAction();
    }
    
    decideAction() {
        const roll = Math.random();
        if (roll < 0.3) {
            this.state = 'idle';
            this.stateTimer = 60 + Math.random() * 120;
        } else if (roll < 0.9) {
            this.state = 'walk';
            this.targetX = 100 + Math.random() * (worldCanvas.width - 200);
            this.direction = this.targetX > this.x ? 1 : -1;
            this.stateTimer = 200;
        } else {
            this.say(['...', '🌲', '⚔️', '💪', '😊'][Math.floor(Math.random() * 5)]);
            this.state = 'idle';
            this.stateTimer = 60;
        }
    }
    
    say(text) {
        this.speechBubble = text;
        this.speechTimer = 90;
    }
    
    update() {
        this.animFrame += 0.1;
        this.stateTimer--;
        
        if (this.stateTimer <= 0) this.decideAction();
        
        if (this.speechTimer > 0) {
            this.speechTimer--;
            if (this.speechTimer <= 0) this.speechBubble = null;
        }
        
        if (this.state === 'walk' && this.targetX) {
            const dx = this.targetX - this.x;
            if (Math.abs(dx) > 3) {
                this.x += Math.sign(dx) * 1;
                this.direction = Math.sign(dx);
            } else {
                this.targetX = null;
                this.decideAction();
            }
        }
        
        // 邊界
        this.x = Math.max(50, Math.min(worldCanvas.width - 50, this.x));
    }
    
    draw(ctx) {
        const x = Math.floor(this.x);
        const y = Math.floor(this.y);
        const img = heroImages[this.data.class];
        const rarity = this.data.rarity?.toLowerCase() || 'common';
        const effect = RARITY_EFFECTS[rarity] || RARITY_EFFECTS.common;
        
        const bounce = this.state === 'walk' ? Math.sin(this.animFrame * 2) * 2 : Math.sin(this.animFrame) * 1;
        const size = 48; // 世界區較小
        
        ctx.save();
        
        // 稀有度光暈（較淡）
        if (effect.glow) {
            ctx.globalAlpha = 0.5;
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = 8 + Math.sin(Date.now() / 500) * 3;
            ctx.fillStyle = effect.glow;
            ctx.beginPath();
            ctx.arc(x, y - size/2 + bounce, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
        
        // 陰影
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 3, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 繪製圖片
        if (img && img.complete) {
            ctx.save();
            ctx.translate(x, y - size/2 + bounce);
            if (this.direction < 0) ctx.scale(-1, 1);
            ctx.drawImage(img, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            // 備用
            ctx.fillStyle = this.classData.main;
            ctx.fillRect(x - 10, y - 35 + bounce, 20, 35);
        }
        
        ctx.restore();
        
        // 說話泡泡
        if (this.speechBubble) {
            ctx.globalAlpha = Math.min(1, this.speechTimer / 20);
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.beginPath();
            ctx.roundRect(x - 15, y - size - 15, 30, 18, 4);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(this.speechBubble, x, y - size - 2);
            ctx.globalAlpha = 1;
        }
        
        // 名字 + 稀有度
        ctx.font = '8px Courier New';
        ctx.textAlign = 'center';
        ctx.fillStyle = effect.color;
        ctx.fillText(`[${rarity.toUpperCase().charAt(0)}]`, x, y + 12);
        ctx.fillStyle = '#ffd700';
        ctx.fillText(this.data.name || `#${this.data.card_id}`, x, y + 22);
    }
}

// ============ 粒子 & 傷害數字 ============
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        game.battleParticles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 4 - 1,
            color, life: 25, size: 3
        });
    }
}

function spawnDamageNumber(x, y, damage, isSkill) {
    game.damageNumbers.push({
        x, y, damage, life: 45,
        vy: -2,
        color: isSkill ? '#9b59b6' : '#e74c3c'
    });
}

// ============ 繪製背景 ============
function drawBattleBackground() {
    const ctx = battleCtx;
    const w = battleCanvas.width;
    const h = battleCanvas.height;
    
    // 漸層背景
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#1a0a2e');
    grad.addColorStop(1, '#16213e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // 地面
    ctx.fillStyle = '#2d5a3d';
    ctx.fillRect(0, h * 0.75, w, h * 0.25);
    
    // 戰鬥圈
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.78, w * 0.4, 20, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawWorldBackground() {
    const ctx = worldCtx;
    const w = worldCanvas.width;
    const h = worldCanvas.height;
    
    // 天空漸層
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(0.6, '#16213e');
    grad.addColorStop(1, '#1a472a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // 星星
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 30; i++) {
        const x = (i * 97 + Date.now() / 200) % w;
        const y = (i * 53) % (h * 0.5);
        const twinkle = Math.sin(Date.now() / 500 + i) * 0.4 + 0.6;
        ctx.globalAlpha = twinkle * 0.5;
        ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
    
    // 世界之樹
    const treeX = w / 2;
    const treeY = h * 0.85;
    
    // 樹幹
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(treeX - 25, treeY - 120, 50, 130);
    
    // 樹冠
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(treeX, treeY - 140, 80, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(treeX - 40, treeY - 120, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(treeX + 40, treeY - 120, 50, 0, Math.PI * 2);
    ctx.fill();
    
    // 發光效果
    ctx.globalAlpha = 0.1 + Math.sin(Date.now() / 1000) * 0.05;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(treeX, treeY - 130, 100, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    // 地面
    ctx.fillStyle = '#2d5a3d';
    ctx.fillRect(0, h * 0.85, w, h * 0.15);
    
    // 草地
    ctx.fillStyle = '#3d7a4d';
    for (let i = 0; i < w; i += 8) {
        ctx.fillRect(i, h * 0.85 - 3, 4, 5 + Math.sin(i * 0.2) * 2);
    }
}

// ============ 戰鬥回放 ============
function loadBattle(data) {
    game.battle = data;
    game.playTick = 0;
    game.eventIndex = 0;
    game.isPlaying = true;
    game.battleParticles = [];
    game.damageNumbers = [];
    
    game.leftFighter = new BattleFighter(data.attacker, 'left');
    game.rightFighter = new BattleFighter(data.defender, 'right');
    
    document.getElementById('leftFighterName').textContent = data.attacker.name;
    document.getElementById('rightFighterName').textContent = data.defender.name;
    document.getElementById('statusDot').className = 'status-dot live';
    document.getElementById('statusText').textContent = '戰鬥中';
    
    document.getElementById('battleLog').innerHTML = '<div class="log-line">⚔️ 戰鬥開始！</div>';
    
    game.battleCount++;
    document.getElementById('battleCount').textContent = game.battleCount;
}

function processBattleEvents() {
    if (!game.isPlaying || !game.battle) return;
    
    const events = game.battle.events;
    
    while (game.eventIndex < events.length && events[game.eventIndex].tick <= game.playTick) {
        handleBattleEvent(events[game.eventIndex]);
        game.eventIndex++;
    }
    
    game.playTick += 2;
    
    // 結束
    if (game.eventIndex >= events.length) {
        setTimeout(() => {
            game.isPlaying = false;
            document.getElementById('statusDot').className = 'status-dot idle';
            document.getElementById('statusText').textContent = '等待中';
        }, 2000);
    }
}

function handleBattleEvent(event) {
    const left = game.leftFighter;
    const right = game.rightFighter;
    const who = event.who === 'attacker' ? left : right;
    const target = event.who === 'attacker' ? right : left;
    
    switch (event.type) {
        case 'attack':
        case 'backstab':
        case 'berserk':
            who.attack();
            setTimeout(() => {
                target.hurt();
                target.hp = Math.max(0, target.hp - event.damage * 0.3);
                spawnDamageNumber(target.x, target.y - 30, event.damage, false);
                spawnParticles(target.x, target.y - 20, '#ff6600', 5);
                updateHpBars();
            }, 200);
            addBattleLog(event.msg, 'attack');
            break;
            
        case 'skill':
            who.skill();
            setTimeout(() => {
                if (event.damage > 0) {
                    target.hurt();
                    target.hp = Math.max(0, target.hp - event.damage * 0.3);
                    spawnDamageNumber(target.x, target.y - 30, event.damage, true);
                    spawnParticles(target.x, target.y - 20, '#9b59b6', 8);
                    updateHpBars();
                }
            }, 300);
            addBattleLog(event.msg, 'skill');
            break;
            
        case 'evade':
            addBattleLog(event.msg, 'evade');
            break;
            
        case 'death':
            const dead = event.who === 'attacker' ? left : right;
            dead.die();
            spawnParticles(dead.x, dead.y - 20, '#333', 15);
            addBattleLog(event.msg, 'death');
            break;
            
        case 'battle_end':
            addBattleLog(event.msg, 'skill');
            break;
    }
}

function updateHpBars() {
    const leftPct = Math.max(0, game.leftFighter.hp);
    const rightPct = Math.max(0, game.rightFighter.hp);
    
    const leftBar = document.getElementById('leftHpBar');
    const rightBar = document.getElementById('rightHpBar');
    
    leftBar.style.width = leftPct + '%';
    rightBar.style.width = rightPct + '%';
    
    leftBar.className = 'fill' + (leftPct < 30 ? ' danger' : '');
    rightBar.className = 'fill' + (rightPct < 30 ? ' danger' : '');
}

function addBattleLog(msg, type) {
    const log = document.getElementById('battleLog');
    const line = document.createElement('div');
    line.className = 'log-line ' + type;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

// ============ 資料獲取 ============
async function fetchBattle() {
    try {
        const res = await fetch(BATTLE_URL + '?t=' + Date.now());
        const data = await res.json();
        
        if (data.id !== game.battleId) {
            game.battleId = data.id;
            loadBattle(data);
        }
    } catch (e) {
        console.error('Fetch battle error:', e);
    }
}

async function fetchHeroes() {
    try {
        const res = await fetch(HEROES_URL + '?t=' + Date.now());
        const data = await res.json();
        
        // 更新世界英雄
        data.heroes.forEach(hero => {
            if (!game.worldHeroes.find(h => h.data.card_id === hero.card_id)) {
                const x = 100 + Math.random() * (worldCanvas.width - 200);
                const y = worldCanvas.height * 0.82;
                game.worldHeroes.push(new WorldHero(hero, x, y));
            }
        });
        
        document.getElementById('aliveCount').textContent = game.worldHeroes.length;
    } catch (e) {
        // 用測試資料
    }
}

function toggleAutoFetch() {
    game.autoFetch = !game.autoFetch;
    const btn = document.getElementById('autoFetchBtn');
    
    if (game.autoFetch) {
        btn.classList.add('active');
        game.autoFetchTimer = setInterval(() => {
            fetchBattle();
            fetchHeroes();
        }, POLL_INTERVAL);
        fetchBattle();
        fetchHeroes();
    } else {
        btn.classList.remove('active');
        clearInterval(game.autoFetchTimer);
    }
}

function spawnTestHero() {
    const classes = ['knight', 'mage', 'archer', 'rogue'];
    const names = ['小明', '小華', '阿強', '小美', '大雄', '火焰', '冰霜', '暗影', '聖光'];
    const rarities = ['common', 'common', 'uncommon', 'uncommon', 'rare', 'rare', 'epic', 'legendary', 'mythic'];
    const x = 100 + Math.random() * (worldCanvas.width - 200);
    const y = worldCanvas.height * 0.82;
    
    const heroClass = classes[Math.floor(Math.random() * classes.length)];
    const rarity = rarities[Math.floor(Math.random() * rarities.length)];
    const suffix = { knight: '騎士', mage: '法師', archer: '弓手', rogue: '盜賊' }[heroClass];
    
    game.worldHeroes.push(new WorldHero({
        card_id: Date.now(),
        name: names[Math.floor(Math.random() * names.length)] + suffix,
        class: heroClass,
        rarity: rarity
    }, x, y));
    
    document.getElementById('aliveCount').textContent = game.worldHeroes.length;
    console.log(`✨ 召喚 ${rarity} ${heroClass}`);
}

// ============ 主迴圈 ============
function gameLoop() {
    // === 戰鬥區 ===
    battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);
    drawBattleBackground();
    
    if (game.leftFighter && game.rightFighter) {
        game.leftFighter.update();
        game.rightFighter.update();
        game.leftFighter.draw(battleCtx);
        game.rightFighter.draw(battleCtx);
    } else {
        battleCtx.fillStyle = '#888';
        battleCtx.font = '12px Courier New';
        battleCtx.textAlign = 'center';
        battleCtx.fillText('等待戰鬥...', battleCanvas.width / 2, battleCanvas.height / 2);
    }
    
    // 粒子
    game.battleParticles = game.battleParticles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        battleCtx.globalAlpha = p.life / 25;
        battleCtx.fillStyle = p.color;
        battleCtx.fillRect(p.x, p.y, p.size, p.size);
        return p.life > 0;
    });
    battleCtx.globalAlpha = 1;
    
    // 傷害數字
    game.damageNumbers = game.damageNumbers.filter(d => {
        d.y += d.vy;
        d.vy += 0.08;
        d.life--;
        battleCtx.globalAlpha = Math.min(1, d.life / 15);
        battleCtx.font = 'bold 14px Courier New';
        battleCtx.textAlign = 'center';
        battleCtx.fillStyle = '#000';
        battleCtx.fillText('-' + d.damage, d.x + 1, d.y + 1);
        battleCtx.fillStyle = d.color;
        battleCtx.fillText('-' + d.damage, d.x, d.y);
        return d.life > 0;
    });
    battleCtx.globalAlpha = 1;
    
    processBattleEvents();
    
    // === 世界區 ===
    worldCtx.clearRect(0, 0, worldCanvas.width, worldCanvas.height);
    drawWorldBackground();
    
    game.worldHeroes.forEach(hero => {
        hero.update();
        hero.draw(worldCtx);
    });
    
    requestAnimationFrame(gameLoop);
}

// ============ 初始化 ============
function init() {
    resizeCanvases();
    
    // 加幾個測試英雄
    for (let i = 0; i < 4; i++) {
        spawnTestHero();
    }
    
    // 嘗試載入資料
    fetchBattle();
    
    gameLoop();
}

// Polyfill
if (!battleCtx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
    };
}

init();
</script>
