<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 娜米的英雄舞台 v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #0f2027 100%);
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            border-bottom: 3px solid #ffd700;
        }
        
        .header h1 {
            font-size: 20px;
            color: #ffd700;
            text-shadow: 2px 2px #000;
        }
        
        .header p {
            font-size: 10px;
            color: #88c0d0;
            margin-top: 4px;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(180deg, 
                #1a0a2e 0%, 
                #16213e 40%, 
                #0f3460 70%,
                #1a472a 85%,
                #2d5a3d 100%
            );
            border: 3px solid #333;
            image-rendering: pixelated;
        }
        
        .controls {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.7);
        }
        
        .controls button {
            background: linear-gradient(180deg, #4a4a6a, #2a2a4a);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px 16px;
            margin: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .controls button:hover {
            background: linear-gradient(180deg, #5a5a7a, #3a3a5a);
        }
        
        .controls button:active {
            transform: scale(0.95);
        }
        
        .info-panel {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            font-size: 10px;
        }
        
        .info-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            min-width: 120px;
        }
        
        .info-box h4 {
            color: #ffd700;
            margin-bottom: 4px;
        }
        
        .log-panel {
            background: rgba(0,0,0,0.8);
            border-top: 2px solid #27ae60;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
        }
        
        .log-panel .log-title {
            color: #27ae60;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .log-panel .log-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #222;
            color: #aaa;
        }
        
        .log-entry.battle { color: #e74c3c; }
        .log-entry.summon { color: #f1c40f; }
        .log-entry.move { color: #3498db; }
        .log-entry.chat { color: #9b59b6; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌲 娜米的英雄舞台 v2</h1>
            <p>Canvas 2D 遊戲引擎 | 英雄們自由行動中...</p>
        </header>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <button onclick="spawnHero()">✨ 召喚英雄</button>
            <button onclick="triggerBattle()">⚔️ 觸發戰鬥</button>
            <button onclick="triggerChat()">💬 英雄對話</button>
            <button onclick="toggleSpeed()">⏩ 切換速度</button>
        </div>
        
        <div class="info-panel">
            <div class="info-box">
                <h4>🦸 英雄數量</h4>
                <span id="heroCount">0</span>
            </div>
            <div class="info-box">
                <h4>⚔️ 戰鬥次數</h4>
                <span id="battleCount">0</span>
            </div>
            <div class="info-box">
                <h4>💀 陣亡數</h4>
                <span id="deathCount">0</span>
            </div>
            <div class="info-box">
                <h4>⏱️ 運行時間</h4>
                <span id="runtime">00:00</span>
            </div>
        </div>
        
        <div class="log-panel">
            <div class="log-title">LIVE 事件記錄</div>
            <div id="logContainer"></div>
        </div>
    </div>

<script>
// ============ 遊戲引擎 ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 遊戲狀態
const game = {
    heroes: [],
    particles: [],
    battleCount: 0,
    deathCount: 0,
    startTime: Date.now(),
    speed: 1,
    groundY: 340
};

// 職業定義
const CLASSES = {
    warrior: { 
        name: '戰士', 
        color: '#c0392b', 
        accent: '#e74c3c',
        weapon: 'sword',
        speed: 1.2,
        phrases: ['衝啊！', '保護同伴！', '戰鬥吧！', '來單挑！']
    },
    mage: { 
        name: '法師', 
        color: '#2980b9', 
        accent: '#3498db',
        weapon: 'staff',
        speed: 0.8,
        phrases: ['魔法準備中...', '見識魔法吧！', '冷靜分析...', '能量聚集！']
    },
    archer: { 
        name: '弓手', 
        color: '#27ae60', 
        accent: '#2ecc71',
        weapon: 'bow',
        speed: 1.5,
        phrases: ['瞄準！', '一箭穿心！', '隱身中...', '看我神射！']
    },
    knight: { 
        name: '騎士', 
        color: '#f39c12', 
        accent: '#f1c40f',
        weapon: 'shield',
        speed: 0.9,
        phrases: ['守護！', '盾牌準備！', '正義必勝！', '防禦陣型！']
    }
};

const RARITIES = ['N', 'R', 'SR', 'SSR'];
const RARITY_COLORS = { N: '#7f8c8d', R: '#3498db', SR: '#9b59b6', SSR: '#f1c40f' };

// ============ 英雄類別 ============
class Hero {
    constructor(x, classType, rarity) {
        this.x = x;
        this.y = game.groundY;
        this.classType = classType;
        this.classData = CLASSES[classType];
        this.rarity = rarity;
        this.name = this.generateName();
        
        this.vx = 0;
        this.vy = 0;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.state = 'idle'; // idle, walk, attack, hurt, dead
        this.stateTimer = 0;
        this.animFrame = 0;
        this.animTimer = 0;
        
        this.targetX = null;
        this.target = null;
        this.speechBubble = null;
        this.speechTimer = 0;
        
        this.hp = 100;
        this.maxHp = 100;
        this.dead = false;
        this.deathTimer = 0;
        
        this.decideNextAction();
    }
    
    generateName() {
        const prefixes = ['火焰', '冰霜', '雷霆', '暗影', '聖光', '翠綠', '血紅', '蒼白'];
        const suffixes = {
            warrior: ['劍士', '戰士', '狂戰', '武者'],
            mage: ['法師', '術士', '魔導', '咒師'],
            archer: ['獵手', '射手', '弓兵', '游俠'],
            knight: ['騎士', '守衛', '聖騎', '護衛']
        };
        return prefixes[Math.floor(Math.random() * prefixes.length)] + 
               suffixes[this.classType][Math.floor(Math.random() * suffixes[this.classType].length)];
    }
    
    decideNextAction() {
        if (this.dead) return;
        
        const roll = Math.random();
        if (roll < 0.3) {
            // 站著不動
            this.state = 'idle';
            this.stateTimer = 60 + Math.random() * 120;
        } else if (roll < 0.8) {
            // 走動
            this.state = 'walk';
            this.targetX = 50 + Math.random() * (canvas.width - 100);
            this.direction = this.targetX > this.x ? 1 : -1;
            this.stateTimer = 300;
        } else {
            // 說話
            this.say(this.classData.phrases[Math.floor(Math.random() * this.classData.phrases.length)]);
            this.state = 'idle';
            this.stateTimer = 90;
        }
    }
    
    say(text) {
        this.speechBubble = text;
        this.speechTimer = 120;
        addLog(`💬 ${this.name}：「${text}」`, 'chat');
    }
    
    update() {
        if (this.dead) {
            this.deathTimer++;
            this.y += 0.5; // 沉下去
            return this.deathTimer < 180; // 3秒後移除
        }
        
        // 動畫幀
        this.animTimer++;
        if (this.animTimer > 10) {
            this.animTimer = 0;
            this.animFrame = (this.animFrame + 1) % 4;
        }
        
        // 狀態計時
        this.stateTimer--;
        if (this.stateTimer <= 0) {
            this.decideNextAction();
        }
        
        // 說話泡泡
        if (this.speechTimer > 0) {
            this.speechTimer--;
            if (this.speechTimer <= 0) {
                this.speechBubble = null;
            }
        }
        
        // 移動
        if (this.state === 'walk' && this.targetX !== null) {
            const speed = this.classData.speed * game.speed;
            const dx = this.targetX - this.x;
            if (Math.abs(dx) > 5) {
                this.x += Math.sign(dx) * speed;
                this.direction = Math.sign(dx);
            } else {
                this.targetX = null;
                this.decideNextAction();
            }
        }
        
        // 攻擊狀態
        if (this.state === 'attack') {
            if (this.stateTimer === 20 && this.target && !this.target.dead) {
                // 造成傷害
                this.target.takeDamage(20 + Math.random() * 10, this);
                spawnParticles(this.target.x, this.target.y - 20, '#ff0000', 5);
            }
        }
        
        // 邊界檢查
        this.x = Math.max(30, Math.min(canvas.width - 30, this.x));
        
        return true;
    }
    
    takeDamage(amount, attacker) {
        this.hp -= amount;
        this.state = 'hurt';
        this.stateTimer = 30;
        
        if (this.hp <= 0) {
            this.hp = 0;
            this.dead = true;
            this.state = 'dead';
            game.deathCount++;
            addLog(`💀 ${this.name} 被 ${attacker.name} 擊敗了！`, 'battle');
            spawnParticles(this.x, this.y - 20, '#ff6600', 15);
        }
    }
    
    attack(target) {
        this.target = target;
        this.state = 'attack';
        this.stateTimer = 40;
        this.direction = target.x > this.x ? 1 : -1;
        addLog(`⚔️ ${this.name} 攻擊 ${target.name}！`, 'battle');
    }
    
    draw() {
        const x = Math.floor(this.x);
        const y = Math.floor(this.y);
        
        ctx.save();
        
        // 死亡淡出
        if (this.dead) {
            ctx.globalAlpha = Math.max(0, 1 - this.deathTimer / 180);
        }
        
        // 受傷閃爍
        if (this.state === 'hurt' && this.stateTimer % 6 < 3) {
            ctx.globalAlpha *= 0.5;
        }
        
        // 翻轉方向
        ctx.translate(x, y);
        ctx.scale(this.direction, 1);
        
        // 繪製像素角色
        this.drawPixelHero(0, 0);
        
        ctx.restore();
        
        // 繪製血條
        if (!this.dead) {
            this.drawHpBar(x, y);
        }
        
        // 繪製名字和稀有度
        this.drawNameTag(x, y);
        
        // 繪製說話泡泡
        if (this.speechBubble) {
            this.drawSpeechBubble(x, y);
        }
    }
    
    drawPixelHero(x, y) {
        const c = this.classData;
        const walkOffset = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 2 : 0;
        const attackOffset = this.state === 'attack' ? (this.stateTimer > 20 ? 5 : -3) : 0;
        
        // 身體
        ctx.fillStyle = c.color;
        ctx.fillRect(x - 8, y - 32 + walkOffset, 16, 20);
        
        // 頭
        ctx.fillStyle = '#fdbf6f';
        ctx.fillRect(x - 6, y - 44, 12, 12);
        
        // 眼睛
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 4, y - 40, 2, 2);
        ctx.fillRect(x + 2, y - 40, 2, 2);
        
        // 頭髮/帽子
        ctx.fillStyle = c.accent;
        ctx.fillRect(x - 7, y - 48, 14, 6);
        
        // 手臂
        ctx.fillStyle = c.color;
        ctx.fillRect(x - 14, y - 30 + walkOffset, 6, 12);
        ctx.fillRect(x + 8 + attackOffset, y - 30 + walkOffset, 6, 12);
        
        // 腿（走路動畫）
        ctx.fillStyle = '#2c3e50';
        const legOffset1 = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 4 : 0;
        const legOffset2 = this.state === 'walk' ? -Math.sin(this.animFrame * Math.PI / 2) * 4 : 0;
        ctx.fillRect(x - 6, y - 12, 5, 12 + legOffset1);
        ctx.fillRect(x + 1, y - 12, 5, 12 + legOffset2);
        
        // 武器
        this.drawWeapon(x + attackOffset, y, walkOffset);
    }
    
    drawWeapon(x, y, walkOffset) {
        const weapon = this.classData.weapon;
        
        if (weapon === 'sword') {
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(x + 12, y - 38 + walkOffset, 4, 20);
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x + 10, y - 20 + walkOffset, 8, 4);
        } else if (weapon === 'staff') {
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x + 12, y - 50 + walkOffset, 3, 40);
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(x + 13, y - 52 + walkOffset, 6, 0, Math.PI * 2);
            ctx.fill();
        } else if (weapon === 'bow') {
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x + 14, y - 40 + walkOffset, 3, 25);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + 15, y - 40 + walkOffset);
            ctx.lineTo(x + 20, y - 28 + walkOffset);
            ctx.lineTo(x + 15, y - 15 + walkOffset);
            ctx.stroke();
        } else if (weapon === 'shield') {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(x - 18, y - 32 + walkOffset, 8, 16);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(x - 16, y - 28 + walkOffset, 4, 8);
        }
    }
    
    drawHpBar(x, y) {
        const barWidth = 30;
        const barHeight = 4;
        const barY = y - 55;
        
        // 背景
        ctx.fillStyle = '#333';
        ctx.fillRect(x - barWidth/2, barY, barWidth, barHeight);
        
        // 血量
        const hpPercent = this.hp / this.maxHp;
        ctx.fillStyle = hpPercent > 0.5 ? '#27ae60' : hpPercent > 0.25 ? '#f1c40f' : '#e74c3c';
        ctx.fillRect(x - barWidth/2, barY, barWidth * hpPercent, barHeight);
        
        // 邊框
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - barWidth/2, barY, barWidth, barHeight);
    }
    
    drawNameTag(x, y) {
        ctx.font = '8px Courier New';
        ctx.textAlign = 'center';
        
        // 稀有度
        ctx.fillStyle = RARITY_COLORS[this.rarity];
        ctx.fillText(`[${this.rarity}]`, x, y + 15);
        
        // 名字
        ctx.fillStyle = '#fff';
        ctx.fillText(this.name, x, y + 25);
    }
    
    drawSpeechBubble(x, y) {
        const text = this.speechBubble;
        ctx.font = '10px Courier New';
        const textWidth = ctx.measureText(text).width;
        const bubbleWidth = textWidth + 16;
        const bubbleHeight = 20;
        const bubbleX = x - bubbleWidth / 2;
        const bubbleY = y - 75;
        
        // 泡泡淡出
        const alpha = Math.min(1, this.speechTimer / 30);
        ctx.globalAlpha = alpha;
        
        // 背景
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.beginPath();
        ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 4);
        ctx.fill();
        
        // 邊框
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 小三角
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.beginPath();
        ctx.moveTo(x - 5, bubbleY + bubbleHeight);
        ctx.lineTo(x, bubbleY + bubbleHeight + 6);
        ctx.lineTo(x + 5, bubbleY + bubbleHeight);
        ctx.fill();
        
        // 文字
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(text, x, bubbleY + 14);
        
        ctx.globalAlpha = 1;
    }
}

// ============ 粒子系統 ============
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        game.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            color,
            life: 30 + Math.random() * 30,
            size: 2 + Math.random() * 3
        });
    }
}

function updateParticles() {
    game.particles = game.particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // 重力
        p.life--;
        return p.life > 0;
    });
}

function drawParticles() {
    game.particles.forEach(p => {
        ctx.globalAlpha = p.life / 60;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

// ============ 背景繪製 ============
function drawBackground() {
    // 星星
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 30; i++) {
        const x = (i * 97 + Date.now() / 100) % canvas.width;
        const y = (i * 53) % (canvas.height * 0.6);
        const twinkle = Math.sin(Date.now() / 500 + i) * 0.5 + 0.5;
        ctx.globalAlpha = twinkle * 0.8;
        ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
    
    // 大地之樹（背景）
    ctx.globalAlpha = 0.2;
    // 樹幹
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(canvas.width/2 - 20, canvas.height - 100, 40, 100);
    // 樹冠
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height - 120, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    // 地面
    ctx.fillStyle = '#2d5a3d';
    ctx.fillRect(0, game.groundY + 10, canvas.width, canvas.height - game.groundY);
    
    // 草地紋理
    ctx.fillStyle = '#3d7a4d';
    for (let i = 0; i < canvas.width; i += 8) {
        const h = 3 + Math.sin(i * 0.5) * 2;
        ctx.fillRect(i, game.groundY + 8, 4, h);
    }
}

// ============ 遊戲邏輯 ============
function spawnHero() {
    const classTypes = Object.keys(CLASSES);
    const classType = classTypes[Math.floor(Math.random() * classTypes.length)];
    const rarity = RARITIES[Math.floor(Math.random() * Math.random() * RARITIES.length)]; // 偏向低稀有度
    const x = 50 + Math.random() * (canvas.width - 100);
    
    const hero = new Hero(x, classType, rarity);
    game.heroes.push(hero);
    
    addLog(`✨ ${hero.name} [${rarity}] 從大地之樹誕生！`, 'summon');
    spawnParticles(x, game.groundY - 20, '#ffd700', 10);
    
    updateStats();
}

function triggerBattle() {
    const aliveHeroes = game.heroes.filter(h => !h.dead);
    if (aliveHeroes.length < 2) {
        addLog('⚠️ 需要至少 2 位存活英雄才能戰鬥！', 'system');
        return;
    }
    
    // 隨機選兩個英雄
    const shuffled = aliveHeroes.sort(() => Math.random() - 0.5);
    const attacker = shuffled[0];
    const defender = shuffled[1];
    
    // 靠近對方
    attacker.targetX = defender.x + (attacker.x < defender.x ? -30 : 30);
    attacker.state = 'walk';
    
    setTimeout(() => {
        if (!attacker.dead && !defender.dead) {
            attacker.attack(defender);
            game.battleCount++;
            updateStats();
            
            // 反擊
            setTimeout(() => {
                if (!defender.dead && !attacker.dead) {
                    defender.attack(attacker);
                }
            }, 500);
        }
    }, 1000);
}

function triggerChat() {
    const aliveHeroes = game.heroes.filter(h => !h.dead);
    if (aliveHeroes.length === 0) {
        addLog('⚠️ 沒有存活的英雄！', 'system');
        return;
    }
    
    const hero = aliveHeroes[Math.floor(Math.random() * aliveHeroes.length)];
    hero.say(hero.classData.phrases[Math.floor(Math.random() * hero.classData.phrases.length)]);
}

function toggleSpeed() {
    game.speed = game.speed === 1 ? 2 : game.speed === 2 ? 0.5 : 1;
    addLog(`⏩ 遊戲速度：${game.speed}x`, 'system');
}

function updateStats() {
    document.getElementById('heroCount').textContent = game.heroes.filter(h => !h.dead).length;
    document.getElementById('battleCount').textContent = game.battleCount;
    document.getElementById('deathCount').textContent = game.deathCount;
}

function updateRuntime() {
    const elapsed = Math.floor((Date.now() - game.startTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('runtime').textContent = `${min}:${sec}`;
}

function addLog(text, type = '') {
    const container = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.innerHTML = `<span style="color:#666">[${time}]</span> ${text}`;
    container.insertBefore(entry, container.firstChild);
    
    // 保持最多 20 條
    while (container.children.length > 20) {
        container.removeChild(container.lastChild);
    }
}

// ============ 主遊戲迴圈 ============
function gameLoop() {
    // 清除畫面
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製背景
    drawBackground();
    
    // 更新並繪製英雄
    game.heroes = game.heroes.filter(hero => hero.update());
    
    // 按 Y 座標排序（後面的先畫）
    game.heroes.sort((a, b) => a.y - b.y);
    game.heroes.forEach(hero => hero.draw());
    
    // 粒子
    updateParticles();
    drawParticles();
    
    // 更新統計
    updateRuntime();
    
    requestAnimationFrame(gameLoop);
}

// ============ 初始化 ============
function init() {
    addLog('🌲 娜米的英雄舞台啟動！', 'system');
    addLog('💡 點擊「召喚英雄」開始遊戲', 'system');
    
    // 自動生成一些英雄
    setTimeout(() => spawnHero(), 500);
    setTimeout(() => spawnHero(), 1000);
    setTimeout(() => spawnHero(), 1500);
    setTimeout(() => spawnHero(), 2000);
    
    // 隨機事件
    setInterval(() => {
        if (Math.random() < 0.3 && game.heroes.filter(h => !h.dead).length >= 2) {
            triggerBattle();
        }
    }, 8000);
    
    setInterval(() => {
        if (Math.random() < 0.5) {
            triggerChat();
        }
    }, 5000);
    
    gameLoop();
}

// Polyfill for roundRect
if (!ctx.roundRect) {
    ctx.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

init();
</script>
