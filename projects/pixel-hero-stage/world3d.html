<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌲 娜米的英雄世界 - 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: linear-gradient(180deg, #87CEEB 0%, #e0f4ff 50%, #90EE90 100%);
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        #container { 
            width: 100vw; 
            height: 100vh; 
        }
        canvas {
            display: block;
        }
        
        .ui-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #2d5a3d;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 12px;
            border: 3px solid #27ae60;
            box-shadow: 0 4px 15px rgba(39,174,96,0.3);
            z-index: 100;
        }
        
        .ui-overlay h1 {
            color: #27ae60;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .info-line {
            margin: 5px 0;
            font-size: 12px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .ctrl-btn {
            background: rgba(255,255,255,0.95);
            border: 3px solid #27ae60;
            color: #2d5a3d;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .ctrl-btn:hover, .ctrl-btn:active {
            background: #27ae60;
            color: #fff;
            transform: scale(1.05);
        }
        
        #error-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e74c3c;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="error-msg"></div>
    
    <div class="ui-overlay">
        <h1>🌲 娜米的英雄世界</h1>
        <div class="info-line">🎮 拖曳旋轉 | 雙指縮放</div>
        <div class="info-line" id="heroCount">👥 英雄：0</div>
        <div class="info-line" id="status">⏳ 載入中...</div>
    </div>
    
    <div class="controls">
        <button class="ctrl-btn" onclick="resetCamera()">🏠 重設</button>
        <button class="ctrl-btn" onclick="loadRealHeroes()">🔄 重載</button>
        <button class="ctrl-btn" onclick="toggleAutoRotate()">🌀 旋轉</button>
    </div>

    <!-- Three.js (使用 ES Module) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // ============ 場景設定 ============
    let scene, camera, renderer, controls, labelRenderer;
    let worldTree, ground;
    let heroes = [];
    let heroSprites = [];
    let autoRotate = false;
    
    // 職業對應貼圖
    const classTextures = {};
    const textureLoader = new THREE.TextureLoader();
    
    // 職業顏色（備用）
    const classColors = {
        knight: 0xc0392b,
        mage: 0x8e44ad,
        rogue: 0x27ae60,
        archer: 0xe67e22
    };
    
    const classNames = ['knight', 'mage', 'rogue', 'archer'];
    
    // 讓函數全域可用
    window.spawnHero = spawnHero;
    window.resetCamera = resetCamera;
    window.toggleAutoRotate = toggleAutoRotate;
    window.loadRealHeroes = loadRealHeroes;
    
    // 預載職業貼圖
    async function loadTextures() {
        const promises = classNames.map(cls => {
            return new Promise((resolve) => {
                textureLoader.load(
                    `${cls}.png`,
                    (texture) => {
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.NearestFilter;
                        classTextures[cls] = texture;
                        resolve();
                    },
                    undefined,
                    () => resolve() // 載入失敗也繼續
                );
            });
        });
        await Promise.all(promises);
    }
    
    // 載入真實英雄資料
    async function loadRealHeroes() {
        try {
            const response = await fetch('heroes/alive.json');
            const data = await response.json();
            
            // 清除現有英雄
            heroSprites.forEach(h => scene.remove(h));
            heroSprites = [];
            
            // 建立真實英雄
            data.heroes.forEach(heroData => {
                createHeroSprite(heroData);
            });
            
            document.getElementById('heroCount').textContent = `👥 英雄：${data.count}`;
            document.getElementById('status').textContent = '✅ 已載入存活英雄！';
        } catch (e) {
            console.error('載入英雄失敗:', e);
            document.getElementById('status').textContent = '⚠️ 載入失敗，使用測試資料';
        }
    }
    
    // 建立英雄 Sprite
    function createHeroSprite(heroData) {
        const heroClass = heroData.class || 'knight';
        const texture = classTextures[heroClass];
        
        let sprite;
        if (texture) {
            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true
            });
            sprite = new THREE.Sprite(material);
            sprite.scale.set(3, 3, 1); // 放大像素圖
        } else {
            // 沒有貼圖時用色塊
            const material = new THREE.SpriteMaterial({ 
                color: classColors[heroClass] || 0xffffff
            });
            sprite = new THREE.Sprite(material);
            sprite.scale.set(2, 2, 1);
        }
        
        // 隨機位置
        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 20;
        sprite.position.set(
            Math.cos(angle) * radius,
            1.5,
            Math.sin(angle) * radius
        );
        
        sprite.userData = {
            ...heroData,
            targetX: sprite.position.x,
            targetZ: sprite.position.z,
            speed: 0.015 + Math.random() * 0.01,
            moveTimer: Math.random() * 200
        };
        
        // 頭頂 ID 標籤
        const labelDiv = document.createElement('div');
        const displayName = heroData.name || `#${heroData.id}`;
        const killText = heroData.kills > 0 ? ` ⚔${heroData.kills}` : '';
        labelDiv.textContent = displayName + killText;
        labelDiv.style.cssText = `
            color: #fff;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        `;
        const label = new CSS2DObject(labelDiv);
        label.position.set(0, 2.5, 0);
        sprite.add(label);
        
        scene.add(sprite);
        heroSprites.push(sprite);
    }
    
    async function init() {
        try {
            // 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5BA3D9);
            scene.fog = new THREE.Fog(0x5BA3D9, 80, 250);
            
            // 相機
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 40);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // 標籤渲染器（頭頂 ID）
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.getElementById('container').appendChild(labelRenderer.domElement);
            
            // 軌道控制
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.2;
            controls.minDistance = 15;
            controls.maxDistance = 100;
            controls.target.set(0, 8, 0);
            controls.enablePan = false;
            
            // 光源
            setupLights();
            
            // 建立世界
            createGround();
            createMountains();
            createWorldTree();
            createClouds();
            
            // 載入貼圖和真實英雄
            document.getElementById('status').textContent = '⏳ 載入英雄貼圖...';
            await loadTextures();
            
            document.getElementById('status').textContent = '⏳ 載入存活英雄...';
            await loadRealHeroes();
            
            // 事件
            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('status').textContent = '✅ 載入完成！';
            
            // 開始動畫
            animate();
            
        } catch (e) {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').textContent = '載入錯誤：' + e.message;
            console.error(e);
        }
    }
    
    function setupLights() {
        // 環境光（柔和）
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        
        // 主光源（暖陽光）
        const sun = new THREE.DirectionalLight(0xfffbe8, 1.0);
        sun.position.set(40, 60, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 200;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        
        // 天空補光（藍色調）
        const skyLight = new THREE.HemisphereLight(0x5BA3D9, 0x689F38, 0.4);
        scene.add(skyLight);
    }
    
    function createGround() {
        // 草地
        const groundGeo = new THREE.CircleGeometry(80, 64);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x7CB342,
            roughness: 0.9
        });
        ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // 小路
        const pathGeo = new THREE.PlaneGeometry(5, 35);
        const pathMat = new THREE.MeshStandardMaterial({ 
            color: 0xD7CCA8,
            roughness: 0.95
        });
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.02, 12);
        scene.add(path);
        
        // 石頭裝飾
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.8 });
        for (let i = 0; i < 8; i++) {
            const stoneGeo = new THREE.DodecahedronGeometry(0.5 + Math.random() * 0.5, 0);
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            const angle = Math.random() * Math.PI * 2;
            const r = 25 + Math.random() * 20;
            stone.position.set(Math.cos(angle) * r, 0.3, Math.sin(angle) * r);
            stone.rotation.set(Math.random(), Math.random(), Math.random());
            stone.castShadow = true;
            scene.add(stone);
        }
    }
    
    function createMountains() {
        // 遠山（像原圖的藍綠色山脈）
        const mountainMat = new THREE.MeshStandardMaterial({ 
            color: 0x6B8E7B,
            roughness: 0.9,
            flatShading: true
        });
        
        const positions = [
            { x: -80, z: -60, scale: 1.2, height: 35 },
            { x: -50, z: -80, scale: 1.0, height: 28 },
            { x: 70, z: -70, scale: 1.1, height: 32 },
            { x: 90, z: -50, scale: 0.9, height: 25 },
            { x: 0, z: -90, scale: 1.3, height: 40 },
        ];
        
        positions.forEach(pos => {
            const mountainGeo = new THREE.ConeGeometry(20 * pos.scale, pos.height, 6);
            const mountain = new THREE.Mesh(mountainGeo, mountainMat);
            mountain.position.set(pos.x, pos.height / 2 - 5, pos.z);
            mountain.rotation.y = Math.random() * Math.PI;
            scene.add(mountain);
        });
    }
    
    function createWorldTree() {
        const treeGroup = new THREE.Group();
        
        // 樹幹（更粗壯）
        const trunkGeo = new THREE.CylinderGeometry(2, 4, 20, 16);
        const trunkMat = new THREE.MeshStandardMaterial({ 
            color: 0xC4A35A,
            roughness: 0.95
        });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 10;
        trunk.castShadow = true;
        treeGroup.add(trunk);
        
        // 樹冠（多層綠色）
        const leafColors = [0x8BC34A, 0xAED581, 0xC5E1A5];
        
        // 主樹冠
        const mainLeafGeo = new THREE.SphereGeometry(12, 32, 24);
        const mainLeafMat = new THREE.MeshStandardMaterial({ 
            color: leafColors[0],
            roughness: 0.8
        });
        const mainLeaf = new THREE.Mesh(mainLeafGeo, mainLeafMat);
        mainLeaf.position.y = 25;
        mainLeaf.scale.y = 0.8;
        mainLeaf.castShadow = true;
        treeGroup.add(mainLeaf);
        
        // 側邊樹冠
        const positions = [
            [-7, 20, 0], [7, 20, 0], [0, 22, 6], [0, 22, -6],
            [-5, 28, 4], [5, 28, -4]
        ];
        
        positions.forEach((pos, i) => {
            const leafGeo = new THREE.SphereGeometry(5 + Math.random() * 2, 24, 16);
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: leafColors[i % leafColors.length],
                roughness: 0.8
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(...pos);
            leaf.castShadow = true;
            treeGroup.add(leaf);
        });
        
        // 金色發光
        const glowGeo = new THREE.SphereGeometry(14, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ 
            color: 0xffd700,
            transparent: true,
            opacity: 0.12
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.y = 24;
        glow.name = 'glow';
        treeGroup.add(glow);
        
        // 根部
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const rootGeo = new THREE.CylinderGeometry(0.4, 1.2, 6, 8);
            const root = new THREE.Mesh(rootGeo, trunkMat);
            root.position.set(Math.cos(angle) * 4, 1, Math.sin(angle) * 4);
            root.rotation.z = Math.cos(angle) * 0.6;
            root.rotation.x = Math.sin(angle) * 0.6;
            root.castShadow = true;
            treeGroup.add(root);
        }
        
        worldTree = treeGroup;
        scene.add(worldTree);
    }
    
    function createClouds() {
        const cloudMat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        
        for (let i = 0; i < 6; i++) {
            const cloudGroup = new THREE.Group();
            
            for (let j = 0; j < 4; j++) {
                const cloudGeo = new THREE.SphereGeometry(3 + Math.random() * 3, 16, 12);
                const cloud = new THREE.Mesh(cloudGeo, cloudMat);
                cloud.position.set(j * 4 - 6 + Math.random() * 2, Math.random() * 2, Math.random() * 2);
                cloud.scale.y = 0.6;
                cloudGroup.add(cloud);
            }
            
            const angle = (i / 6) * Math.PI * 2;
            const radius = 60 + Math.random() * 30;
            cloudGroup.position.set(
                Math.cos(angle) * radius,
                40 + Math.random() * 20,
                Math.sin(angle) * radius
            );
            cloudGroup.userData.speed = 0.001 + Math.random() * 0.002;
            cloudGroup.userData.radius = radius;
            cloudGroup.userData.angle = angle;
            cloudGroup.name = 'cloud';
            scene.add(cloudGroup);
        }
    }
    
    function spawnHero() {
        const heroClass = classNames[Math.floor(Math.random() * classNames.length)];
        const color = classColors[heroClass];
        
        // 英雄身體
        const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.2, 8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: color,
            roughness: 0.6,
            metalness: 0.1
        });
        const hero = new THREE.Mesh(bodyGeo, bodyMat);
        
        // 隨機位置
        const angle = Math.random() * Math.PI * 2;
        const radius = 10 + Math.random() * 20;
        hero.position.set(
            Math.cos(angle) * radius,
            1.1,
            Math.sin(angle) * radius
        );
        hero.castShadow = true;
        
        hero.userData = {
            class: heroClass,
            targetX: hero.position.x,
            targetZ: hero.position.z,
            speed: 0.015 + Math.random() * 0.015,
            moveTimer: Math.random() * 200
        };
        
        scene.add(hero);
        heroes.push(hero);
        
        document.getElementById('heroCount').textContent = `👥 英雄：${heroes.length}`;
    }
    
    function updateHeroes() {
        // 更新 Sprite 英雄
        heroSprites.forEach(hero => {
            const data = hero.userData;
            if (!data) return;
            
            data.moveTimer++;
            
            if (data.moveTimer > 250 + Math.random() * 150) {
                data.moveTimer = 0;
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 20;
                data.targetX = Math.cos(angle) * radius;
                data.targetZ = Math.sin(angle) * radius;
            }
            
            const dx = data.targetX - hero.position.x;
            const dz = data.targetZ - hero.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            if (dist > 0.3) {
                hero.position.x += (dx / dist) * data.speed;
                hero.position.z += (dz / dist) * data.speed;
            }
            
            // 輕微跳動
            hero.position.y = 1.5 + Math.sin(Date.now() / 300 + (data.id || 0)) * 0.1;
        });
    }
    
    function updateClouds() {
        scene.children.filter(c => c.name === 'cloud').forEach(cloud => {
            cloud.userData.angle += cloud.userData.speed;
            cloud.position.x = Math.cos(cloud.userData.angle) * cloud.userData.radius;
            cloud.position.z = Math.sin(cloud.userData.angle) * cloud.userData.radius;
        });
    }
    
    function resetCamera() {
        camera.position.set(0, 20, 40);
        controls.target.set(0, 8, 0);
        controls.update();
    }
    
    function toggleAutoRotate() {
        autoRotate = !autoRotate;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = 0.5;
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        
        updateHeroes();
        updateClouds();
        
        // 樹發光動畫
        if (worldTree) {
            const glow = worldTree.getObjectByName('glow');
            if (glow) {
                glow.material.opacity = 0.08 + Math.sin(Date.now() / 1200) * 0.04;
                glow.scale.setScalar(1 + Math.sin(Date.now() / 1800) * 0.03);
            }
        }
        
        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }
    
    // 啟動
    init();
    </script>
</body>
</html>
