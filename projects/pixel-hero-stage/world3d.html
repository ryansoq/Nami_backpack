<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 娜米的英雄世界 - 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a1a;
            font-family: 'Courier New', monospace;
        }
        #container { 
            width: 100vw; 
            height: 100vh; 
        }
        
        .ui-overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            z-index: 100;
        }
        
        .ui-overlay h1 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .info-line {
            margin: 5px 0;
            font-size: 12px;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .ctrl-btn {
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .ctrl-btn:hover {
            background: #ffd700;
            color: #000;
        }
        
        .hero-label {
            position: absolute;
            color: #fff;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="ui-overlay">
        <h1>🌲 娜米的英雄世界</h1>
        <div class="info-line">🎮 拖曳旋轉 | 滾輪縮放</div>
        <div class="info-line" id="heroCount">👥 英雄：0</div>
        <div class="info-line" id="cameraInfo">📷 視角：預設</div>
    </div>
    
    <div class="controls">
        <button class="ctrl-btn" onclick="resetCamera()">🏠 重設視角</button>
        <button class="ctrl-btn" onclick="spawnHero()">✨ 召喚英雄</button>
        <button class="ctrl-btn" onclick="toggleAutoRotate()">🔄 自動旋轉</button>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
    // ============ 場景設定 ============
    let scene, camera, renderer, controls;
    let worldTree, ground;
    let heroes = [];
    let autoRotate = false;
    
    // 英雄顏色對應職業
    const classColors = {
        knight: 0xe74c3c,  // 紅
        mage: 0x9b59b6,    // 紫
        rogue: 0x2ecc71,   // 綠
        archer: 0xf39c12   // 橙
    };
    
    const classNames = ['knight', 'mage', 'rogue', 'archer'];
    
    function init() {
        // 場景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 天空藍
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
        
        // 相機
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        
        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('container').appendChild(renderer.domElement);
        
        // 軌道控制
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1; // 限制不能看到地底
        controls.minDistance = 10;
        controls.maxDistance = 80;
        controls.target.set(0, 5, 0);
        
        // 光源
        setupLights();
        
        // 建立世界
        createGround();
        createWorldTree();
        createSkybox();
        
        // 初始英雄
        for (let i = 0; i < 5; i++) {
            spawnHero();
        }
        
        // 事件
        window.addEventListener('resize', onWindowResize);
        
        // 開始動畫
        animate();
    }
    
    function setupLights() {
        // 環境光
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        
        // 主光源（太陽）
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(30, 50, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 150;
        sun.shadow.camera.left = -50;
        sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50;
        sun.shadow.camera.bottom = -50;
        scene.add(sun);
        
        // 補光
        const fill = new THREE.DirectionalLight(0x87CEEB, 0.3);
        fill.position.set(-20, 30, -20);
        scene.add(fill);
    }
    
    function createGround() {
        // 草地
        const groundGeo = new THREE.CircleGeometry(60, 64);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x3d8b40,
            roughness: 0.8
        });
        ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // 小路（通往世界之樹）
        const pathGeo = new THREE.PlaneGeometry(4, 30);
        const pathMat = new THREE.MeshStandardMaterial({ 
            color: 0xc4a574,
            roughness: 0.9
        });
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.01, 10);
        scene.add(path);
    }
    
    function createWorldTree() {
        const treeGroup = new THREE.Group();
        
        // 樹幹
        const trunkGeo = new THREE.CylinderGeometry(1.5, 2.5, 15, 16);
        const trunkMat = new THREE.MeshStandardMaterial({ 
            color: 0x5d4037,
            roughness: 0.9
        });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 7.5;
        trunk.castShadow = true;
        treeGroup.add(trunk);
        
        // 樹冠（多個球體組成）
        const leafMat = new THREE.MeshStandardMaterial({ 
            color: 0x27ae60,
            roughness: 0.7
        });
        
        // 主樹冠
        const mainLeafGeo = new THREE.SphereGeometry(8, 32, 32);
        const mainLeaf = new THREE.Mesh(mainLeafGeo, leafMat);
        mainLeaf.position.y = 18;
        mainLeaf.castShadow = true;
        treeGroup.add(mainLeaf);
        
        // 側邊樹冠
        const sideLeafGeo = new THREE.SphereGeometry(5, 32, 32);
        
        const leftLeaf = new THREE.Mesh(sideLeafGeo, leafMat);
        leftLeaf.position.set(-5, 15, 0);
        leftLeaf.castShadow = true;
        treeGroup.add(leftLeaf);
        
        const rightLeaf = new THREE.Mesh(sideLeafGeo, leafMat);
        rightLeaf.position.set(5, 15, 0);
        rightLeaf.castShadow = true;
        treeGroup.add(rightLeaf);
        
        const frontLeaf = new THREE.Mesh(sideLeafGeo, leafMat);
        frontLeaf.position.set(0, 16, 4);
        frontLeaf.castShadow = true;
        treeGroup.add(frontLeaf);
        
        // 發光效果
        const glowGeo = new THREE.SphereGeometry(10, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ 
            color: 0xffd700,
            transparent: true,
            opacity: 0.15
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.y = 17;
        treeGroup.add(glow);
        
        // 根部
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const rootGeo = new THREE.CylinderGeometry(0.3, 0.8, 4, 8);
            const root = new THREE.Mesh(rootGeo, trunkMat);
            root.position.set(Math.cos(angle) * 3, 0.5, Math.sin(angle) * 3);
            root.rotation.z = Math.cos(angle) * 0.5;
            root.rotation.x = Math.sin(angle) * 0.5;
            root.castShadow = true;
            treeGroup.add(root);
        }
        
        worldTree = treeGroup;
        scene.add(worldTree);
    }
    
    function createSkybox() {
        // 簡單的漸層天空
        const skyGeo = new THREE.SphereGeometry(200, 32, 32);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x87CEEB) },
                bottomColor: { value: new THREE.Color(0xffffff) }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0);
                }
            `,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);
    }
    
    function spawnHero() {
        // 隨機職業
        const heroClass = classNames[Math.floor(Math.random() * classNames.length)];
        const color = classColors[heroClass];
        
        // 英雄（簡單的膠囊體）
        const bodyGeo = new THREE.CapsuleGeometry(0.4, 0.8, 8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const hero = new THREE.Mesh(bodyGeo, bodyMat);
        
        // 隨機位置（在樹周圍）
        const angle = Math.random() * Math.PI * 2;
        const radius = 8 + Math.random() * 15;
        hero.position.set(
            Math.cos(angle) * radius,
            0.8,
            Math.sin(angle) * radius
        );
        hero.castShadow = true;
        
        // 儲存英雄資料
        hero.userData = {
            class: heroClass,
            targetX: hero.position.x,
            targetZ: hero.position.z,
            speed: 0.02 + Math.random() * 0.02,
            moveTimer: 0
        };
        
        scene.add(hero);
        heroes.push(hero);
        
        updateHeroCount();
    }
    
    function updateHeroes() {
        heroes.forEach(hero => {
            const data = hero.userData;
            data.moveTimer++;
            
            // 每隔一段時間換目標
            if (data.moveTimer > 200 + Math.random() * 200) {
                data.moveTimer = 0;
                const angle = Math.random() * Math.PI * 2;
                const radius = 8 + Math.random() * 15;
                data.targetX = Math.cos(angle) * radius;
                data.targetZ = Math.sin(angle) * radius;
            }
            
            // 移動向目標
            const dx = data.targetX - hero.position.x;
            const dz = data.targetZ - hero.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            if (dist > 0.5) {
                hero.position.x += (dx / dist) * data.speed;
                hero.position.z += (dz / dist) * data.speed;
                
                // 面向移動方向
                hero.rotation.y = Math.atan2(dx, dz);
            }
            
            // 輕微上下浮動
            hero.position.y = 0.8 + Math.sin(Date.now() / 500 + hero.id) * 0.05;
        });
    }
    
    function updateHeroCount() {
        document.getElementById('heroCount').textContent = `👥 英雄：${heroes.length}`;
    }
    
    function resetCamera() {
        camera.position.set(0, 15, 30);
        controls.target.set(0, 5, 0);
        controls.update();
    }
    
    function toggleAutoRotate() {
        autoRotate = !autoRotate;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = 1;
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        
        // 更新英雄
        updateHeroes();
        
        // 世界之樹發光動畫
        if (worldTree) {
            const glow = worldTree.children.find(c => c.material && c.material.transparent);
            if (glow) {
                glow.material.opacity = 0.1 + Math.sin(Date.now() / 1000) * 0.05;
                glow.scale.setScalar(1 + Math.sin(Date.now() / 1500) * 0.05);
            }
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    
    // 啟動
    init();
    </script>
</body>
</html>
