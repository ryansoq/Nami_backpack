<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雜湊討伐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One visual world on purpose: Nami's night sea (same tokens as her intro page). */
  :root{
    --abyss:#0B1622; --deep:#0F1E2D; --tide:#16324A; --silver:#DCE3EA; --foam:#F4F7FA;
    --ruby:#D2344F; --kelp:#6FA8A0; --mist:rgba(220,227,234,.62); --faint:rgba(220,227,234,.14);
    --display:"LXGW WenKai TC",serif; --body:"Noto Sans TC",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--abyss);color:var(--foam)}
  body{font-family:var(--body);min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:960px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;flex:1}

  header{display:grid;gap:6px}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--kelp)}
  .boss-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.1;text-wrap:balance}
  h1 small{font-family:var(--mono);font-weight:400;font-size:13px;color:var(--mist);margin-left:10px;letter-spacing:.04em}
  .lore{color:var(--mist);font-size:14px;max-width:60ch}
  .hp{position:relative;height:14px;background:var(--deep);border:1px solid var(--faint);border-radius:2px;overflow:hidden;margin-top:6px}
  .hp i{position:absolute;inset:0 auto 0 0;background:var(--ruby);transition:width .25s ease-out}
  .hp b{position:absolute;inset:0 auto 0 0;background:rgba(244,247,250,.35);transition:width .9s ease-out .15s}
  .hp-text{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mist);font-variant-numeric:tabular-nums}

  .stage{position:relative;width:100%;height:clamp(260px,46vh,440px);border:1px solid var(--faint);background:
    radial-gradient(120% 90% at 50% 0%,var(--tide) 0%,var(--deep) 55%,var(--abyss) 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:16px}
  .banner p{font-family:var(--display);font-size:clamp(22px,5vw,34px);color:var(--foam);opacity:0;transition:opacity .4s}
  .banner p.on{opacity:1}
  .banner p em{font-style:normal;color:var(--ruby)}

  .rig{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
  @media (max-width:680px){.rig{grid-template-columns:1fr}}
  .panel{border:1px solid var(--faint);background:var(--deep);padding:14px;display:grid;gap:12px;align-content:start}
  .panel h2{font-size:12px;letter-spacing:.2em;color:var(--kelp);font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
  .stat{display:grid;gap:2px;min-width:0}
  .stat span{font-size:11px;color:var(--mist);letter-spacing:.06em}
  .stat strong{font-family:var(--mono);font-weight:500;font-size:clamp(15px,3.4vw,19px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat strong.hot{color:var(--ruby)}
  .device{font-family:var(--mono);font-size:12px;color:var(--mist);overflow-wrap:anywhere}
  .controls{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-size:15px;padding:10px 18px;border:1px solid var(--silver);background:transparent;color:var(--foam);border-radius:2px;cursor:pointer}
  button.primary{background:var(--ruby);border-color:var(--ruby);color:#fff;min-width:9em}
  button:hover{filter:brightness(1.12)}
  button:focus-visible{outline:2px solid var(--kelp);outline-offset:3px}
  button:disabled{opacity:.45;cursor:default;filter:none}

  .log{list-style:none;padding:0;display:grid;gap:6px;font-family:var(--mono);font-size:12.5px;min-height:9.5em}
  .log li{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
  .log .h{overflow:hidden;text-overflow:ellipsis;color:rgba(220,227,234,.42)}
  .log .h b{font-weight:500;color:var(--silver)}
  .log .d{font-variant-numeric:tabular-nums;color:var(--kelp)}
  .log li.crit .d{color:var(--ruby)}
  .log li.mega .h b,.log li.mega .d{color:var(--ruby);font-weight:500}
  .empty{color:var(--mist);font-family:var(--body);font-size:13px}

  footer{font-size:12.5px;color:var(--mist);line-height:1.7;display:grid;gap:4px;max-width:75ch}
  footer code{font-family:var(--mono);color:var(--silver);font-size:12px}
  @media (prefers-reduced-motion:reduce){.hp i,.hp b,.banner p{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="stageNo">第 1 關 / 共 7 關</div>
    <div class="boss-row">
      <h1 id="bossName">孤塊</h1>
    </div>
    <p class="lore" id="bossLore"></p>
    <div class="hp" role="progressbar" aria-label="Boss 血量" aria-valuemin="0" aria-valuemax="100" id="hpBar"><b id="hpGhost"></b><i id="hpFill"></i></div>
    <div class="hp-text"><span id="hpText"></span><span id="etaText"></span></div>
  </header>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="banner"><p id="banner"></p></div>
  </div>

  <section class="rig">
    <div class="panel">
      <h2>你的礦機</h2>
      <div class="stats">
        <div class="stat"><span>算力</span><strong id="sRate">—</strong></div>
        <div class="stat"><span>已算雜湊</span><strong id="sTotal">0</strong></div>
        <div class="stat"><span>份額難度</span><strong id="sDiff">—</strong></div>
        <div class="stat"><span>命中</span><strong id="sHits">0</strong></div>
        <div class="stat"><span>暴擊</span><strong id="sCrits" class="hot">0</strong></div>
        <div class="stat"><span>最佳雜湊</span><strong id="sBest">—</strong></div>
      </div>
      <div class="device" id="device">正在檢查 WebGPU…</div>
      <div class="controls">
        <button class="primary" id="go" disabled>開始挖礦</button>
      </div>
    </div>
    <div class="panel">
      <h2>最近五擊</h2>
      <ul class="log" id="log"><li class="empty">按下開始，每個低於份額目標的雜湊就是一擊。前導零越多，傷害越高。</li></ul>
    </div>
  </section>

  <footer>
    <p>每一擊都是真的 kHeavyHash：<code>cSHAKE256 → 64×64 矩陣 × 向量 → cSHAKE256</code>，在你的 GPU 上用 WebGPU 計算，並和 ShioKaze 的參考實作逐位元比對過。</p>
    <p>傷害等於份額難度（跟礦池記帳一樣），前導零多出的位數給暴擊倍率，平均下來傷害 ≈ 你算過的雜湊數。這是練習場：不連礦池、不送出區塊、不會領到 KAS。</p>
  </footer>
</div>

<script id="khh">
// kHeavyHash on WebGPU. Shared by the game page (browser) and the tests (node).
//
// Per nonce the GPU runs: cSHAKE256("ProofOfWorkHash", header) -> 64x64
// nibble matrix x vector -> cSHAKE256("HeavyHash", digest). Both cSHAKE calls
// fit in one 136-byte rate block after the personalization block, and that
// first block is the same for every nonce, so the CPU absorbs it once and
// the shader starts from the resulting state: two Keccak-f per hash, not four.

const M64 = (1n << 64n) - 1n;
const RC = [
  0x0000000000000001n, 0x0000000000008082n, 0x800000000000808An, 0x8000000080008000n,
  0x000000000000808Bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
  0x000000000000008An, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000An,
  0x000000008000808Bn, 0x800000000000008Bn, 0x8000000000008089n, 0x8000000000008003n,
  0x8000000000008002n, 0x8000000000000080n, 0x000000000000800An, 0x800000008000000An,
  0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
];
// ROT[x + 5y], and pi sends (x, y) -> (y, 2x + 3y).
const ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
const rotl = (v, n) => n ? ((v << BigInt(n)) | (v >> BigInt(64 - n))) & M64 : v;

function keccakF(a) {
  for (let r = 0; r < 24; r++) {
    const c = [0, 1, 2, 3, 4].map(x => a[x] ^ a[x + 5] ^ a[x + 10] ^ a[x + 15] ^ a[x + 20]);
    for (let x = 0; x < 5; x++) {
      const d = c[(x + 4) % 5] ^ rotl(c[(x + 1) % 5], 1);
      for (let y = 0; y < 5; y++) a[x + 5 * y] ^= d;
    }
    const b = new Array(25);
    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++)
      b[y + 5 * ((2 * x + 3 * y) % 5)] = rotl(a[x + 5 * y], ROT[x + 5 * y]);
    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++)
      a[x + 5 * y] = b[x + 5 * y] ^ (~b[(x + 1) % 5 + 5 * y] & M64 & b[(x + 2) % 5 + 5 * y]);
    a[0] ^= RC[r];
  }
  return a;
}

// State after absorbing bytepad(encode_string("") || encode_string(S), 136).
function cshakePrefixState(name) {
  const s = new TextEncoder().encode(name);
  const blk = new Uint8Array(136);
  blk.set([1, 136, 1, 0, 1, s.length * 8]);
  blk.set(s, 6);
  const a = new Array(25).fill(0n);
  const v = new DataView(blk.buffer);
  for (let i = 0; i < 17; i++) a[i] ^= v.getBigUint64(8 * i, true);
  return keccakF(a);
}

// Absorb one final block of `msg` (< 136 bytes) into a prefix state and squeeze 32 bytes.
function cshakeFinish(prefix, msg) {
  const blk = new Uint8Array(136);
  blk.set(msg); blk[msg.length] ^= 0x04; blk[135] ^= 0x80;
  const a = prefix.slice();
  const v = new DataView(blk.buffer);
  for (let i = 0; i < 17; i++) a[i] ^= v.getBigUint64(8 * i, true);
  keccakF(a);
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  for (let i = 0; i < 4; i++) ov.setBigUint64(8 * i, a[i], true);
  return out;
}

const POW_PREFIX = cshakePrefixState('ProofOfWorkHash');
const HH_PREFIX = cshakePrefixState('HeavyHash');

// ---- matrix (xoshiro256++ seeded by pre_pow_hash, retried until full rank) ----
function xoshiro(s) {
  return () => {
    let r = (s[0] + s[3]) & M64; r = (rotl(r, 23) + s[0]) & M64;
    const t = (s[1] << 17n) & M64;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3]; s[2] ^= t;
    s[3] = rotl(s[3], 45);
    return r;
  };
}
function rank(m) {
  const a = Float64Array.from(m); let r = 0; const sel = new Uint8Array(64);
  for (let i = 0; i < 64; i++) {
    let j = 0; while (j < 64 && (sel[j] || Math.abs(a[j * 64 + i]) < 1e-9)) j++;
    if (j === 64) continue;
    r++; sel[j] = 1; const d = a[j * 64 + i];
    for (let p = i + 1; p < 64; p++) a[j * 64 + p] /= d;
    for (let k = 0; k < 64; k++) if (k !== j && Math.abs(a[k * 64 + i]) > 1e-9) {
      const f = a[k * 64 + i]; for (let p = i + 1; p < 64; p++) a[k * 64 + p] -= a[j * 64 + p] * f;
    }
  }
  return r;
}
function generateMatrix(pre) {
  const v = new DataView(pre.buffer, pre.byteOffset, 32);
  const next = xoshiro([0, 8, 16, 24].map(o => v.getBigUint64(o, true)));
  for (;;) {
    const m = new Uint32Array(4096);
    for (let i = 0; i < 64; i++) for (let j = 0; j < 64; j += 16) {
      const x = next(); for (let k = 0; k < 16; k++) m[i * 64 + j + k] = Number((x >> BigInt(4 * k)) & 0xFn);
    }
    if (rank(m) === 64) return m;
  }
}

// ---- CPU kHeavyHash through the same prefix-state path the shader uses ----
function header80(pre, ts, nonce) {
  const d = new Uint8Array(80); d.set(pre, 0); const v = new DataView(d.buffer);
  v.setBigUint64(32, BigInt(ts), true); v.setBigUint64(72, BigInt(nonce), true);
  return d;
}
function cpuPow(pre, ts, nonce, m) {
  const h = cshakeFinish(POW_PREFIX, header80(pre, ts, nonce));
  const v = []; for (let i = 0; i < 32; i++) v.push(h[i] >> 4, h[i] & 15);
  const d = new Uint8Array(32);
  for (let i = 0; i < 32; i++) {
    let hi = 0, lo = 0;
    for (let j = 0; j < 64; j++) { hi += m[(2 * i) * 64 + j] * v[j]; lo += m[(2 * i + 1) * 64 + j] * v[j]; }
    d[i] = h[i] ^ ((((hi >> 10) & 15) << 4) | ((lo >> 10) & 15));
  }
  return cshakeFinish(HH_PREFIX, d);
}

// ---- fast CPU path: Keccak on 32-bit word pairs (the BigInt one above is ~50x slower) ----
const RC32 = new Uint32Array(48);
RC.forEach((c, i) => { RC32[2 * i] = Number(c & 0xFFFFFFFFn); RC32[2 * i + 1] = Number(c >> 32n); });
const PI_SRC = new Uint8Array(25), PI_ROT = new Uint8Array(25);
for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) {
  const d = y + 5 * ((2 * x + 3 * y) % 5);
  PI_SRC[d] = x + 5 * y; PI_ROT[d] = ROT[x + 5 * y];
}
const _c = new Uint32Array(10), _b = new Uint32Array(50);
function keccakF32(s) {
  for (let r = 0; r < 24; r++) {
    for (let x = 0; x < 5; x++) {
      _c[2 * x] = s[2 * x] ^ s[2 * x + 10] ^ s[2 * x + 20] ^ s[2 * x + 30] ^ s[2 * x + 40];
      _c[2 * x + 1] = s[2 * x + 1] ^ s[2 * x + 11] ^ s[2 * x + 21] ^ s[2 * x + 31] ^ s[2 * x + 41];
    }
    for (let x = 0; x < 5; x++) {
      const p = (x + 4) % 5, q = (x + 1) % 5;
      const lo = _c[2 * p] ^ ((_c[2 * q] << 1) | (_c[2 * q + 1] >>> 31));
      const hi = _c[2 * p + 1] ^ ((_c[2 * q + 1] << 1) | (_c[2 * q] >>> 31));
      for (let y = 0; y < 25; y += 5) { s[2 * (x + y)] ^= lo; s[2 * (x + y) + 1] ^= hi; }
    }
    for (let d = 0; d < 25; d++) {
      const i = PI_SRC[d], n = PI_ROT[d], lo = s[2 * i], hi = s[2 * i + 1];
      if (n === 0) { _b[2 * d] = lo; _b[2 * d + 1] = hi; }
      else if (n < 32) { _b[2 * d] = (lo << n) | (hi >>> (32 - n)); _b[2 * d + 1] = (hi << n) | (lo >>> (32 - n)); }
      else if (n === 32) { _b[2 * d] = hi; _b[2 * d + 1] = lo; }
      else { const k = n - 32; _b[2 * d] = (hi << k) | (lo >>> (32 - k)); _b[2 * d + 1] = (lo << k) | (hi >>> (32 - k)); }
    }
    for (let y = 0; y < 25; y += 5) for (let x = 0; x < 5; x++) {
      const i = 2 * (x + y), j = 2 * ((x + 1) % 5 + y), k = 2 * ((x + 2) % 5 + y);
      s[i] = _b[i] ^ (~_b[j] & _b[k]); s[i + 1] = _b[i + 1] ^ (~_b[j + 1] & _b[k + 1]);
    }
    s[0] ^= RC32[2 * r]; s[1] ^= RC32[2 * r + 1];
  }
}

// Same math as cpuPow, reusing the shader's precomputed states (buildParams).
let _job = null;
function fastPow(pre, ts, nonce, m) {
  if (!_job || _job.pre !== pre || _job.ts !== ts) {
    const u = buildParams(pre, ts, 0n, 0n);
    _job = { pre, ts, pow: u.slice(0, 50), hh: u.slice(52, 102) };
  }
  const s = _job.pow.slice();
  const n = BigInt(nonce);
  s[18] ^= Number(n & 0xFFFFFFFFn); s[19] ^= Number(n >> 32n);
  keccakF32(s);
  const h = new Uint8Array(s.buffer, 0, 32).slice();   // little-endian host (every WebGPU/JS target)
  const v = new Uint8Array(64);
  for (let i = 0; i < 32; i++) { v[2 * i] = h[i] >> 4; v[2 * i + 1] = h[i] & 15; }
  const t = _job.hh.slice(), d = new Uint8Array(t.buffer, 0, 32);
  for (let i = 0; i < 32; i++) {
    let hi = 0, lo = 0; const r0 = 128 * i, r1 = r0 + 64;
    for (let j = 0; j < 64; j++) { hi += m[r0 + j] * v[j]; lo += m[r1 + j] * v[j]; }
    d[i] ^= h[i] ^ ((((hi >> 10) & 15) << 4) | ((lo >> 10) & 15));
  }
  keccakF32(t);
  return new Uint8Array(t.buffer, 0, 32).slice();
}

// ---- WGSL generator: lanes are vec2<u32> (x = low word, y = high word) ----
function rotExpr(v, n) {
  if (n === 0) return v;
  if (n === 32) return `${v}.yx`;
  if (n < 32) return `vec2<u32>((${v}.x << ${n}u) | (${v}.y >> ${32 - n}u), (${v}.y << ${n}u) | (${v}.x >> ${32 - n}u))`;
  const k = n - 32;
  return `vec2<u32>((${v}.y << ${k}u) | (${v}.x >> ${32 - k}u), (${v}.x << ${k}u) | (${v}.y >> ${32 - k}u))`;
}
function keccakWGSL() {
  const L = [];
  L.push('fn keccak_f(s: ptr<function, array<vec2<u32>, 25>>) {');
  L.push('  var a0 = (*s)[0];' + [...Array(24)].map((_, i) => ` var a${i + 1} = (*s)[${i + 1}];`).join(''));
  L.push('  for (var r = 0u; r < 24u; r++) {');
  for (let x = 0; x < 5; x++) L.push(`    let c${x} = a${x} ^ a${x + 5} ^ a${x + 10} ^ a${x + 15} ^ a${x + 20};`);
  for (let x = 0; x < 5; x++) {
    L.push(`    let d${x} = c${(x + 4) % 5} ^ ${rotExpr(`c${(x + 1) % 5}`, 1)};`);
  }
  for (let i = 0; i < 25; i++) L.push(`    a${i} ^= d${i % 5};`);
  for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++)
    L.push(`    let b${y + 5 * ((2 * x + 3 * y) % 5)} = ${rotExpr(`a${x + 5 * y}`, ROT[x + 5 * y])};`);
  for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++)
    L.push(`    a${x + 5 * y} = b${x + 5 * y} ^ (~b${(x + 1) % 5 + 5 * y} & b${(x + 2) % 5 + 5 * y});`);
  L.push('    a0 ^= RC[r];');
  L.push('  }');
  for (let i = 0; i < 25; i++) L.push(`  (*s)[${i}] = a${i};`);
  L.push('}');
  const rc = RC.map(c => `vec2<u32>(${Number(c & 0xFFFFFFFFn)}u, ${Number(c >> 32n)}u)`).join(', ');
  return `const RC = array<vec2<u32>, 24>(${rc});\n` + L.join('\n');
}

const SHADER = () => `
struct Params {
  pow_state: array<vec4<u32>, 13>, // 25 lanes pre-xored with the constant header bytes and padding (lanes 0..8, 10, 16)
  hh_state:  array<vec4<u32>, 13>, // HeavyHash prefix state, padding pre-xored (lanes 4, 16)
  tgt:       array<vec4<u32>, 2>,  // 256-bit little-endian target, word 7 most significant
  nonce_lo:  u32,
  nonce_hi:  u32,
  _pad0: u32, _pad1: u32,
};
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read> matrix: array<u32, 512>; // 64 rows x 8 words, 8 nibbles per word (packMatrix)
@group(0) @binding(2) var<storage, read_write> out: array<atomic<u32>, 64>;
// out[0] = hits, out[1] = best (min) top word, out[2..] = hit nonce pairs (lo, hi), up to 31

${keccakWGSL()}

fn lane(st: array<vec4<u32>, 13>, i: u32) -> vec2<u32> {
  let q = st[i / 2u];
  return select(q.xy, q.zw, (i & 1u) == 1u);
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>, @builtin(num_workgroups) nwg: vec3<u32>) {
  let lo = P.nonce_lo + gid.x + gid.y * nwg.x * 64u;
  let hi = P.nonce_hi + select(0u, 1u, lo < P.nonce_lo);

  var s: array<vec2<u32>, 25>;
  for (var i = 0u; i < 25u; i++) { s[i] = lane(P.pow_state, i); }
  s[9] ^= vec2<u32>(lo, hi);
  keccak_f(&s);

  // 32-byte hash as 8 little-endian words

// Pack the Uint32Array(4096) matrix into 8 nibbles per word, row-major.
function packMatrix(m) {
  const p = new Uint32Array(512);
  for (let r = 0; r < 64; r++) for (let k = 0; k < 8; k++) {
    let w = 0; for (let n = 0; n < 8; n++) w |= m[r * 64 + k * 8 + n] << (4 * n);
    p[r * 8 + k] = w >>> 0;
  }
  return p;
}

function laneWords(state) {
  const u = new Uint32Array(52);
  state.forEach((v, i) => { u[2 * i] = Number(v & 0xFFFFFFFFn); u[2 * i + 1] = Number(v >> 32n); });
  return u;
}

// Uniform block: pow_state(52) hh_state(52) target(8) nonce_lo nonce_hi pad pad = 116 words
function buildParams(pre, ts, targetBig, nonceBig) {
  const blk = new Uint8Array(136);
  blk.set(pre, 0);
  new DataView(blk.buffer).setBigUint64(32, BigInt(ts), true);
  blk[80] ^= 0x04; blk[135] ^= 0x80;
  const a = POW_PREFIX.slice();
  const v = new DataView(blk.buffer);
  for (let i = 0; i < 17; i++) a[i] ^= v.getBigUint64(8 * i, true);

  const hb = new Uint8Array(136); hb[32] ^= 0x04; hb[135] ^= 0x80;
  const b = HH_PREFIX.slice(); const hv = new DataView(hb.buffer);
  for (let i = 0; i < 17; i++) b[i] ^= hv.getBigUint64(8 * i, true);

  const u = new Uint32Array(116);
  u.set(laneWords(a), 0);
  u.set(laneWords(b), 52);
  for (let i = 0; i < 8; i++) u[104 + i] = Number((targetBig >> BigInt(32 * i)) & 0xFFFFFFFFn);
  u[112] = Number(nonceBig & 0xFFFFFFFFn);
  u[113] = Number((nonceBig >> 32n) & 0xFFFFFFFFn);
  return u;
}

class GpuMiner {
  static async create() {
    if (!navigator.gpu) throw new Error('This browser has no WebGPU');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('No GPU adapter available');
    const device = await adapter.requestDevice();
    const m = new GpuMiner();
    m.device = device;
    m.adapterInfo = adapter.info || {};

    const info = await module.getCompilationInfo();
    const errs = info.messages.filter(x => x.type === 'error');
    if (errs.length) throw new Error('WGSL: ' + errs.map(e => `${e.lineNum}:${e.linePos} ${e.message}`).join('; '));
    m.pipeline = await device.createComputePipelineAsync({ layout: 'auto', compute: { module, entryPoint: 'main' } });
    m.params = device.createBuffer({ size: 116 * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    m.matrix = device.createBuffer({ size: 2048, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    m.out = device.createBuffer({ size: 256, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    m.read = device.createBuffer({ size: 256, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

      { binding: 0, resource: { buffer: m.params } },
      { binding: 1, resource: { buffer: m.matrix } },
      { binding: 2, resource: { buffer: m.out } },

    this.mat = generateMatrix(pre);
    this.device.queue.writeBuffer(this.matrix, 0, packMatrix(this.mat));

  setTarget(targetBig) { this.target = targetBig; }

  // Hash about `count` nonces starting at `nonce`; returns how many were actually hashed
  // (rounded to whole workgroups; a 2D dispatch lifts the 65535-workgroup cap).
  async run(nonce, count, maxX = 65535) {
    const groups = Math.max(1, Math.ceil(count / 64));
    const gx = Math.min(groups, maxX), gy = Math.ceil(groups / gx);

    await this.read.mapAsync(GPUMapMode.READ);
    const r = new Uint32Array(this.read.getMappedRange().slice(0));
    this.read.unmap();
    const hits = [];
    for (let i = 0; i < Math.min(r[0], 31); i++) hits.push((BigInt(r[3 + 2 * i]) << 32n) | BigInt(r[2 + 2 * i]));

    const core = blocks.find(b => b.core);
    for (const b of blocks) if (b.alive > 0) { b.alive = 0.999; crumble(b); }
    if (core) for (let i = 0; i < 40; i++) bits.push({ x: core.x, y: core.y, vx: (Math.random() - .5) * 260, vy: (Math.random() - .7) * 220, life: 1.4, c: COL.ruby });
    if (!reduceMotion) shake = 10;
  }
  function frame(now) {
    const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
    const t = (now - t0) / 1000;
    ctx.save(); ctx.clearRect(0, 0, W, H);
    if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake = Math.max(0, shake - 40 * dt); }

    // sea floor: two slow kelp swells under the fight
    for (let k = 0; k < 2; k++) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H * (0.86 + k * 0.05) + Math.sin(x / (90 + k * 40) + t * (0.6 + k * 0.3)) * (6 + k * 3));
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = k ? 'rgba(111,168,160,.10)' : 'rgba(111,168,160,.06)'; ctx.fill();
    }

    syncHp();
    // edges
    ctx.lineWidth = 1;
    for (const [a, b] of edges) {
      const al = Math.min(a.alive, b.alive); if (al <= 0.01) continue;
      ctx.strokeStyle = `rgba(220,227,234,${0.22 * al})`;
      ctx.beginPath(); ctx.moveTo(a.x + a.w / 2, a.y); ctx.lineTo(b.x - b.w / 2, b.y); ctx.stroke();
    }
    // blocks
    for (const b of blocks) {
      if (b.alive < 1) b.alive = Math.max(0, b.alive - dt * 2.5);
      if (b.alive <= 0.01) continue;
      const bob = reduceMotion ? 0 : Math.sin(t * 1.3 + b.c + b.k) * 2;
      ctx.globalAlpha = b.alive;
      ctx.fillStyle = b.flash > 0 ? COL.foam : b.core ? '#3A1420' : COL.tide;
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2 + bob, b.w, b.h);
      ctx.strokeStyle = b.core ? COL.ruby : 'rgba(220,227,234,.55)';
      ctx.lineWidth = b.core ? 2 : 1;
      ctx.strokeRect(b.x - b.w / 2 + .5, b.y - b.h / 2 + bob + .5, b.w - 1, b.h - 1);
      if (b.core) { // the core's eye
        const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
        ctx.fillStyle = `rgba(210,52,79,${0.55 + 0.45 * pulse})`;
        ctx.fillRect(b.x - b.w * 0.18, b.y - b.h * 0.12 + bob, b.w * 0.36, b.h * 0.24);
      }
      b.flash = Math.max(0, b.flash - dt * 6);
      ctx.globalAlpha = 1;
    }
    // shots: the hash itself flies, leading zeros bright
    ctx.textBaseline = 'middle';
    shots = shots.filter(s => {
      s.t += dt * 1000; const p = Math.min(1, s.t / s.dur), e = 1 - (1 - p) ** 3;
      const x = s.sx + (s.tgt.x - s.sx) * e, y = s.sy + (s.tgt.y - s.sy) * e - Math.sin(p * Math.PI) * 30;
      ctx.font = `${s.tier ? 500 : 400} ${s.tier === 'mega' ? 15 : 12}px "IBM Plex Mono", monospace`;
      const zs = s.txt.slice(0, s.z), rest = s.txt.slice(s.z);
      const wz = ctx.measureText(zs).width, wr = ctx.measureText(rest).width, x0 = x - (wz + wr) / 2;
      ctx.fillStyle = s.tier ? COL.ruby : COL.silver; ctx.fillText(zs, x0, y);
      ctx.fillStyle = 'rgba(220,227,234,.35)'; ctx.fillText(rest, x0 + wz, y);
      if (p >= 1) {
        s.tgt.flash = 1;
        pops.push({ x: s.tgt.x, y: s.tgt.y - 14, life: 1, txt: (s.tier === 'mega' ? '會心 ' : s.tier === 'crit' ? '暴擊 ' : '') + fmt(s.dmg), tier: s.tier });
        if (s.tier === 'mega' && !reduceMotion) shake = 6;
        return false;
      }
      return true;
    });
    // damage numbers
    pops = pops.filter(p => {
      p.life -= dt * 0.9; p.y -= dt * 28;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = `700 ${p.tier === 'mega' ? 26 : p.tier === 'crit' ? 20 : 15}px "LXGW WenKai TC", serif`;
      ctx.fillStyle = p.tier ? COL.ruby : COL.foam; ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      return p.life > 0;
    });
    // debris
    bits = bits.filter(b => {
      b.life -= dt; b.vy += 220 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life)); ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, 3, 3); ctx.globalAlpha = 1;
      return b.life > 0 && b.y < H + 10;
    });
    ctx.restore();
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  return { init() { resize(); requestAnimationFrame(frame); }, spawn, fire, shatter };
})();

// ---------------- boot ----------------
fx.init(); showBoss();
const go = $('go');
(async () => {
  try { S.engine = await gpuEngine(); }
  catch (e) {
    console.warn('WebGPU unavailable, falling back to CPU:', e.message);
    try { S.engine = cpuEngine(); }
    catch (e2) { $('device').textContent = `這個瀏覽器既沒有 WebGPU，也不允許背景執行緒（${e2.message}）。請換 Chrome、Edge 或 Safari 26 以上。`; return; }
  }
  $('device').textContent = S.engine.label;
  newJob();
  go.disabled = false;
})();
go.addEventListener('click', () => {
  S.running = !S.running;
  if (S.running) { S.lastDiffAt = performance.now(); S.engine.start(); go.textContent = '暫停'; banner('開始挖礦'); }
  else { S.engine.stop(); go.textContent = '繼續挖礦'; }
  hud();
});
window.__game = S; // for the headless test
})();
</script>
